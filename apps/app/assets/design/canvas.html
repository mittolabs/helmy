<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design</title>
<style>
  :root { --bg: #f2f2f0; --dot: #d6d6d2; --text: #1a1a1a; --muted: #6b6b66; --ring: #3b82f6; --strip-hover: #e2e2de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --dot: #262626; --text: #ededed; --muted: #8f8f8f; --ring: #60a5fa; --strip-hover: #222222; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Inter", sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: absolute; inset: 0; cursor: default; outline: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
  #stage.hand { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .board { position: absolute; }
  .strip { position: absolute; left: 0; bottom: 100%; height: 28px; display: flex; align-items: center;
    gap: 6px; color: var(--muted); white-space: nowrap; cursor: default; }
  .strip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .strip button { all: unset; width: 22px; height: 22px; border-radius: 5px; place-items: center;
    color: var(--muted); cursor: pointer; }
  /* Its buttons show on the screen under the pointer, so the name has the room. */
  .strip button { display: none; }
  .board:hover .strip button { display: grid; }
  .strip button:hover { background: var(--strip-hover); color: var(--text); }
  .strip svg { width: 14px; height: 14px; }
  .frame { position: absolute; inset: 0; overflow: hidden; background: #fff; border-radius: var(--radius, 0);
    box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.10); }
  .frame iframe { border: 0; width: 100%; height: 100%; display: block; pointer-events: none; background: #fff; }
  .board.picked .frame, .board.focused .frame { outline: 2px solid var(--ring); outline-offset: 2px; }
  .note { position: absolute; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; white-space: pre-wrap; }
  .note.sticky { font-weight: 400; font-size: 15px; letter-spacing: 0; padding: 12px; border-radius: 6px;
    background: #fde68a; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .box { position: absolute; box-sizing: border-box; border: 1px solid var(--ring); pointer-events: none; }
  .box.hover { opacity: .55; }
  .handle { position: absolute; width: 9px; height: 9px; box-sizing: border-box; margin: -4px 0 0 -4px;
    background: #fff; border: 1.5px solid var(--ring); border-radius: 2px; pointer-events: auto; }
  .handle.se, .handle.nw { cursor: nwse-resize; }
  .handle.ne, .handle.sw { cursor: nesw-resize; }
  .handle.e, .handle.w { cursor: ew-resize; }
  .handle.s, .handle.n { cursor: ns-resize; }
  .note { cursor: default; }
  .tag { position: absolute; transform: translateY(-100%); margin-top: -4px; padding: 1px 5px; border-radius: 4px;
    background: var(--ring); color: #fff; font-size: 11px; white-space: nowrap; pointer-events: none; }
  #stage.commenting { cursor: crosshair; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -22px 0 0 0; border-radius: 11px 11px 11px 2px;
    background: var(--ring); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); pointer-events: none; }
  .cbox { position: absolute; width: 260px; padding: 10px; box-sizing: border-box; border-radius: 10px; pointer-events: auto;
    background: var(--bg); color: var(--text); border: 1px solid var(--dot); box-shadow: 0 8px 28px rgba(0,0,0,.28);
    display: flex; flex-direction: column; gap: 8px; -webkit-user-select: text; user-select: text; }
  .cbox .about { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbox textarea { font: inherit; font-size: 13px; resize: none; height: 64px; padding: 8px; border-radius: 6px; box-sizing: border-box;
    border: 1px solid var(--dot); background: transparent; color: var(--text); outline: none; }
  .cbox textarea:focus { border-color: var(--ring); }
  .cbox .row { display: flex; justify-content: flex-end; gap: 6px; }
  .cbox button { all: unset; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .cbox button.go { background: var(--ring); color: #fff; }
  .cbox button.no { color: var(--muted); }
  /* A web page drawn at a phone's, a tablet's or a desktop's width. */
  .strip .widths { display: none; gap: 2px; }
  .board.responsive:hover .strip .widths { display: flex; }
  .strip .widths button { display: block; width: auto; height: auto; padding: 2px 6px; font-size: 11px; }
  .strip .widths button.on { color: var(--text); background: var(--strip-hover); }
  #empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
  /* A name or title being renamed, in place. */
  [data-renaming] { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 3px; cursor: text; }
  /* A screen previewed on its own, working, in its device: like a prototype. */
  #present { position: absolute; inset: 0; z-index: 10; display: none; background: #000; }
  #present.on { display: block; }
  #present .bar { position: absolute; top: 12px; left: 12px; display: flex; gap: 2px; padding: 4px; border-radius: 10px;
    background: #1c1c1f; box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 2; }
  #present .bar button { all: unset; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
    color: #c8c8cc; cursor: pointer; }
  #present .bar button:hover { background: #2c2c30; color: #fff; }
  #present .bar svg { width: 16px; height: 16px; }
  #present .bar .title { padding: 0 10px 0 6px; color: #a0a0a8; font-size: 12px; display: flex; align-items: center; }
  #present .device { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; background: #fff; overflow: hidden; }
  #present .device iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  #present .device.phone { border: 12px solid #0b0b0b; border-radius: 54px;
    box-shadow: 0 0 0 1.5px #3a3a40, 0 24px 64px rgba(0,0,0,.6); }
  #present .device.phone::after { content: ''; position: absolute; top: 9px; left: 50%; width: 112px; height: 32px;
    margin-left: -56px; border-radius: 16px; background: #000; }
  #present .device.tablet { border: 16px solid #0b0b0b; border-radius: 34px; box-shadow: 0 0 0 1.5px #3a3a40, 0 24px 64px rgba(0,0,0,.6); }
  /* A window presenting one screen (Present): only it, nothing of the canvas. */
  #present.window { overflow: auto; }
  #present.window .device.actual { position: relative; left: auto; top: auto; transform: none; margin: 64px auto 32px; }
  #present.window.desktop.on { display: flex; flex-direction: column; }
  #present.window.desktop .bar { position: static; border-radius: 0; box-shadow: none; flex: none; border-bottom: 1px solid #2a2a2e; }
  #present.window.desktop .device { position: static; transform: none; flex: 1; width: 100%; border-radius: 0; box-shadow: none; }
  .strip button.narrow { width: 14px; }
  #present .device.desktop { border-radius: 10px; box-shadow: 0 0 0 1px #3a3a3e, 0 24px 64px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="stage" tabindex="0"><div id="world"></div><div id="overlay"></div></div>
<div id="empty"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const base = 'd/' + params.get('d') + '/';
  // Helmy can open a window of its own here: a screen previews in one.
  const windows = params.get('windows') === '1';
  // A window presenting this one screen (Present): only it, nothing of the canvas.
  const presentOnly = params.get('present');
  // What ▶ plays: the view over the canvas (Preview), or a window (Present).
  let playMode = windows && params.get('play') === 'present' ? 'present' : 'preview';
  const playLabel = () => (playMode === 'present' ? 'Present' : 'Preview');
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const overlay = document.getElementById('overlay');
  const empty = document.getElementById('empty');
  const icons = {
    frame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    size: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    forward: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  };
  let canvas = null;          // canvas.json as last read
  let view = { x: 0, y: 0, s: 1 };
  let fitted = false;
  let viewTold = 0;
  const boards = new Map();   // file -> element

  // Editing: the tool, what is under the pointer, what is picked, what is
  // being typed into, and what to undo.
  let tool = 'select';
  let space = false;
  let hover = null;           // { file, el }
  let picked = null;          // { file, el } (el null: the screen itself), or { note } (a title's key)
  let typing = null;          // { file, el, before, html }
  const undos = [];           // { file, text }
  let pins = [];              // comments waiting to go: { key, file, x, y, n }
  let pinCount = 0;
  let commentBox = null;      // { el (the box), file, target, x, y }

  const tell = (m) => { try { Helmy.postMessage(JSON.stringify(m)); } catch (_) {} };

  // ---- Drawing --------------------------------------------------------

  function apply() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
    // Where it is looked at, told once it rests, for Helmy to keep with the chat.
    clearTimeout(viewTold);
    viewTold = setTimeout(() => tell({ view: { x: Math.round(view.x), y: Math.round(view.y), s: view.s } }), 400);
    stage.style.backgroundSize = `${24 * view.s}px ${24 * view.s}px`;
    stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
    // The strips stay a readable size at any zoom, as wide as their screen,
    // but never taller than the room above their screen: zoomed out, a
    // name the same size on screen would cover what is above it.
    const room = roomAbove();
    for (const el of world.querySelectorAll('.strip')) {
      const fits = Math.max(room.get(el.parentElement.dataset.file) ?? Infinity, 10) / 28;
      const k = Math.min(1 / view.s, fits);
      el.style.transform = `scale(${k})`;
      el.style.width = (Number(el.dataset.w) / k) + 'px';
    }
    marks();
    tell({ zoom: view.s });
  }

  function bounds(only) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const add = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
    for (const [file, b] of Object.entries(canvas?.boards ?? {})) {
      if (only && file !== only) continue;
      add(b.x, b.y - 32, b.w, b.h + 32);
    }
    if (!only) for (const n of Object.values(canvas?.notes ?? {})) add(n.x, n.y, n.w ?? 400, n.size ?? 72);
    return x0 === Infinity ? null : { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  function fit(only) {
    const b = bounds(only);
    if (!b) return;
    const pad = 48;
    const s = Math.min((innerWidth - pad * 2) / b.w, (innerHeight - pad * 2) / b.h, only ? 2 : 1);
    view = { s, x: (innerWidth - b.w * s) / 2 - b.x * s, y: (innerHeight - b.h * s) / 2 - b.y * s };
    for (const [file, el] of boards) el.classList.toggle('focused', file === only);
    apply();
  }

  function zoomAt(factor, cx, cy) {
    const s = Math.min(4, Math.max(0.05, view.s * factor));
    view.x = cx - (cx - view.x) * (s / view.s);
    view.y = cy - (cy - view.y) * (s / view.s);
    view.s = s;
    apply();
  }

  function button(kind, label, onClick) {
    const b = document.createElement('button');
    b.innerHTML = icons[kind];
    b.title = label;
    b.setAttribute('aria-label', label);
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    return b;
  }

  function place(file) {
    const b = canvas.boards[file], el = boards.get(file);
    if (!b || !el) return;
    Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    el.querySelector('.strip').dataset.w = b.w;
    el.dataset.device = deviceOf(b);
    for (const wb of el.querySelectorAll('.widths button')) wb.classList.toggle('on', Number(wb.dataset.w) === b.w);
  }

  /** What a screen is shown as: the device its index names, else one its width suggests. */
  const deviceOf = (b) => b.device ?? (b.w <= 500 ? 'phone' : b.w <= 1100 ? 'tablet' : 'desktop');

  /** A responsive page's height: its content's, at its width. */
  function fitHeight(file) {
    const b = canvas?.boards[file];
    if (!b?.responsive) return false;
    const doc = docOf(file);
    // Measured in a window of a device's height, not the screen's own: a
    // page is never shorter than its window, so measured in its own it
    // could only ever grow, and a page that got shorter kept its old
    // height as empty space under it.
    const iframe = boards.get(file)?.querySelector('iframe');
    const at = { phone: 844, tablet: 1194, desktop: 900 }[deviceOf(b)];
    if (iframe) iframe.style.height = at + 'px';
    const h = Math.max(200, Math.ceil(doc?.documentElement.scrollHeight ?? 0));
    if (iframe) iframe.style.height = '';
    if (!doc || h === b.h) return false;
    b.h = h;
    place(file);
    unstack();
    apply();
    return true;
  }

  /**
   * Nothing drawn over anything else: a screen that grew as its page loaded,
   * or a title that wrapped onto more lines than its place had room for,
   * moves what is under it down, keeping a gap. Only ever down, and only what
   * overlaps (side by side is left alone); stickies sit where they are put.
   */
  /** Each screen's free height above it, up to what is over it, by file. */
  function roomAbove() {
    const out = new Map();
    const all = Object.entries(canvas?.boards ?? {});
    const others = [
      ...all.map(([file, b]) => ({ file, x: b.x, w: b.w, top: b.y, bottom: b.y + b.h })),
      ...[...world.querySelectorAll('.note:not(.sticky)')].filter((el) => el._note)
        .map((el) => ({ x: el._note.x, w: el._w ?? el.offsetWidth, top: el._note.y, bottom: el._note.y + (el._h ?? el.offsetHeight) })),
    ];
    for (const [file, b] of all) {
      let room = Infinity;
      for (const o of others) {
        if (o.file === file || !(b.x < o.x + o.w && o.x < b.x + b.w) || o.top >= b.y) continue;
        room = Math.min(room, Math.max(0, b.y - o.bottom));
      }
      out.set(file, room);
    }
    return out;
  }

  /**
   * Title [key] where its note says, at its size: alone, as a screen dragged is
   * placed alone. Nothing else is moved out of its way while it is dragged.
   */
  function placeNote(key) {
    const n = canvas.notes?.[key];
    const el = world.querySelector(`.note[data-note="${CSS.escape(key)}"]`);
    if (!n || !el) return;
    Object.assign(el.style, {
      left: n.x + 'px', top: n.y + 'px',
      width: n.w ? n.w + 'px' : '', height: n.h ? n.h + 'px' : '',
    });
  }

  function unstack() {
    // A screen's name sits above it: room kept for it, so it can be read
    // zoomed out to about half.
    const GAP = 32, STRIP = 56;
    const items = [];
    for (const [file, b] of Object.entries(canvas?.boards ?? {})) {
      items.push({ x: b.x, w: b.w, top: b.y - STRIP, h: b.h + STRIP, move: (d) => { b.y += d; place(file); } });
    }
    for (const el of world.querySelectorAll('.note:not(.sticky)')) {
      const n = el._note;
      if (!n) continue;
      el._w = el.offsetWidth; el._h = el.offsetHeight;
      items.push({ x: n.x, w: el._w, top: n.y, h: el._h, move: (d) => { n.y += d; el.style.top = n.y + 'px'; } });
    }
    items.sort((a, b) => a.top - b.top || a.x - b.x);
    for (let i = 1; i < items.length; i++) {
      const it = items[i];
      let down = 0;
      for (let j = 0; j < i; j++) {
        const o = items[j], bottom = o.top + o.h;
        const across = it.x < o.x + o.w && o.x < it.x + it.w;
        if (across && bottom > it.top) down = Math.max(down, bottom + GAP - it.top);
      }
      if (down > 0) { it.top += down; it.move(down); }
    }
  }

  /** A responsive page drawn at [w] wide, kept in the index. */
  function widthTo(file, w) {
    const b = canvas.boards[file];
    if (!b || b.w === w) return;
    const before = indexText();
    b.w = w;
    place(file);
    apply();
    // Laid out again at the new width: then its height, then saved.
    requestAnimationFrame(() => requestAnimationFrame(() => { fitHeight(file); saveIndex(before); }));
  }

  function draw(changed) {
    const seen = new Set();
    const order = canvas.order ?? Object.keys(canvas.boards ?? {});
    for (const file of order) {
      const b = canvas.boards?.[file];
      if (!b) continue;
      seen.add(file);
      let el = boards.get(file);
      if (!el) {
        el = document.createElement('div');
        el.className = 'board';
        el.dataset.file = file;
        const strip = document.createElement('div');
        strip.className = 'strip';
        strip.style.transformOrigin = '0 100%';
        const name = document.createElement('span');
        name.className = 'name';
        name.title = 'Double-click to rename';
        name.addEventListener('pointerdown', (e) => { if (renaming?.el === name) e.stopPropagation(); });
        // Saving: Helmy's menu, under the button (the HTML file, or exported as code).
        const save = button('download', 'Save or export this screen', () => {
          const r = save.getBoundingClientRect();
          tell({ download: file, at: [r.left, r.bottom + 4] });
        });
        const play = button('play', playLabel(), () => playIt(file));
        play.classList.add('play');
        // Beside ▶: Preview or Present, Helmy's menu under it.
        const choose = button('chevron', 'Preview or present', () => {
          const r = choose.getBoundingClientRect();
          tell({ playMenu: file, mode: playMode, at: [r.left, r.bottom + 4] });
        });
        choose.classList.add('narrow');
        strip.append(name,
          play,
          ...(windows ? [choose] : []),
          button('frame', 'Zoom to this screen', () => fit(file)),
          save);
        const widths = document.createElement('span');
        widths.className = 'widths';
        for (const [label, w] of [['Phone', 390], ['Tablet', 834], ['Desktop', 1440]]) {
          const wb = document.createElement('button');
          wb.textContent = label;
          wb.dataset.w = w;
          wb.title = `Draw it ${w} wide`;
          wb.addEventListener('pointerdown', (e) => e.stopPropagation());
          wb.addEventListener('click', (e) => { e.stopPropagation(); widthTo(file, w); });
          widths.append(wb);
        }
        strip.insertBefore(widths, strip.children[1]);
        const frame = document.createElement('div');
        frame.className = 'frame';
        const iframe = document.createElement('iframe');
        iframe.src = base + file;
        iframe.title = b.title ?? file;
        // A responsive page is as tall as what it holds at its width.
        iframe.addEventListener('load', () => {
          fitHeight(file);
          // What its file holds, and the element picked before the page came again.
          learn(file);
          if (picked?.file === file) {
            const again = pickedId ? elOf(file, pickedId) : null;
            pick(again ? { file, el: again } : { file, el: null });
          }
          // Scrolling over a screen moves the canvas, even while the screen
          // has the pointer (its text being typed into): its page never
          // scrolls by itself, being as tall as it is drawn.
          iframe.contentWindow?.addEventListener('wheel', (e) => {
            const r = iframe.getBoundingClientRect(), k = r.width / (iframe.clientWidth || 1);
            wheel(e, r.left + e.clientX * k, r.top + e.clientY * k);
          }, { passive: false });
        });
        frame.append(iframe);
        el.append(strip, frame);
        boards.set(file, el);
      } else if (changed === true || (changed ?? []).includes(file)) {
        if (typing?.file === file) continue; // being typed into: the person's text stands
        el.querySelector('iframe').src = base + file + '?v=' + Date.now();
        if (picked?.file === file) picked = { file, el: null };
      }
      place(file);
      el.style.setProperty('--radius', (b.radius ?? 0) + 'px');
      el.querySelector('.name').textContent = b.title ?? file.replace(/\.html?$/, '');
      el.classList.toggle('responsive', !!b.responsive);
      world.append(el); // back to front, in order
    }
    for (const [file, el] of boards) if (!seen.has(file)) { el.remove(); boards.delete(file); }
    for (const n of world.querySelectorAll('.note')) n.remove();
    for (const [key, n] of Object.entries(canvas.notes ?? {})) {
      const el = document.createElement('div');
      el.dataset.note = key;
      el.className = 'note' + (n.kind === 'title' ? '' : ' sticky');
      el.textContent = n.text ?? '';
      el._note = n;
      el.addEventListener('pointerdown', (e) => { if (renaming?.el === el) e.stopPropagation(); });

      Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px' });
      if (n.kind === 'title') el.style.fontSize = (n.size ?? 72) + 'px';
      if (n.w) el.style.width = n.w + 'px';
      // A fixed size (dragged by its top, bottom or a corner); else as tall as its lines.
      if (n.h) el.style.height = n.h + 'px';
      world.prepend(el);
    }
    unstack();
    apply();
  }

  let presentedOnce = false;

  async function load(changed) {
    try {
      const r = await fetch(base + 'canvas.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('none');
      const text = await r.text();
      canvas = JSON.parse(text);
      bases.set('canvas.json', text);
      empty.style.display = 'none';
      if (presentOnly) {
        if (!presentedOnce) { presentedOnce = true; presentPage(presentOnly); }
        return;
      }
      draw(changed);
      if (!fitted) {
        fitted = true;
        // Where this chat last looked, when Helmy kept it; else everything, fitted.
        const [x, y, s] = (params.get('v') ?? '').split(',').map(Number);
        if (s > 0 && Number.isFinite(x) && Number.isFinite(y)) { view = { x, y, s }; apply(); } else fit();
      }
      tell({ loaded: { title: canvas.title ?? '', screens: (canvas.order ?? Object.keys(canvas.boards ?? {})).map((f) => ({ file: f, title: canvas.boards?.[f]?.title ?? f })) } });
    } catch (e) {
      if (canvas) return; // keep what showed; the file is mid-write
      empty.style.display = 'grid';
      empty.textContent = e.message === 'none' ? 'No design here yet.' : "This design's index can't be read: " + e.message;
    }
  }

  // ---- Where things are -----------------------------------------------

  const toWorld = (cx, cy) => ({ x: (cx - view.x) / view.s, y: (cy - view.y) / view.s });

  /** The screen under a point on the canvas, front first, and the point on it. */
  function screenAt(cx, cy) {
    const p = toWorld(cx, cy);
    const order = canvas?.order ?? Object.keys(canvas?.boards ?? {});
    for (let i = order.length - 1; i >= 0; i--) {
      const b = canvas.boards[order[i]];
      if (b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        return { file: order[i], x: p.x - b.x, y: p.y - b.y };
      }
    }
    return null;
  }

  const docOf = (file) => {
    try { return boards.get(file)?.querySelector('iframe').contentDocument ?? null; } catch (_) { return null; }
  };

  /** The element at a point on a screen; null for the page itself, or for
   *  what fills it (the screen's own container counts as the screen). */
  function elementAt(file, x, y) {
    const doc = docOf(file);
    const el = doc?.elementFromPoint(x, y);
    if (!el || el === doc.body || el === doc.documentElement) return null;
    const b = canvas.boards[file], r = el.getBoundingClientRect();
    return r.width >= b.w * 0.95 && r.height >= b.h * 0.95 ? null : el;
  }

  /** Where [el] (on [file]) is on the canvas, in the canvas page's pixels. */
  function rectOf(file, el) {
    const b = canvas.boards[file];
    if (!el) return { x: view.x + b.x * view.s, y: view.y + b.y * view.s, w: b.w * view.s, h: b.h * view.s };
    const r = el.getBoundingClientRect();
    return { x: view.x + (b.x + r.left) * view.s, y: view.y + (b.y + r.top) * view.s, w: r.width * view.s, h: r.height * view.s };
  }

  const nameOf = (el) => {
    const tag = el.tagName.toLowerCase();
    const words = (el.textContent ?? '').trim().replace(/\s+/g, ' ');
    return words && words.length <= 24 ? `${tag} · ${words}` : tag;
  };

  /** Marks on the canvas: under the pointer, picked, with its handles. */
  function marks() {
    overlay.textContent = '';
    for (const [file, el] of boards) el.classList.toggle('picked', picked?.file === file && !picked.el);
    if (picked?.el && !picked.el.isConnected) picked = null;
    if (hover?.el && !hover.el.isConnected) hover = null;
    const box = (r, cls) => {
      const d = document.createElement('div');
      d.className = 'box ' + cls;
      Object.assign(d.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      overlay.append(d);
    };
    if (hover && !(picked && hover.file === picked.file && hover.el === picked.el) && !typing) box(rectOf(hover.file, hover.el), 'hover');
    for (const p of pins) {
      const b = canvas?.boards[p.file];
      if (!b) continue;
      const d = document.createElement('div');
      d.className = 'pin';
      d.textContent = p.n;
      Object.assign(d.style, { left: view.x + (b.x + p.x) * view.s + 'px', top: view.y + (b.y + p.y) * view.s + 'px' });
      overlay.append(d);
    }
    if (commentBox) {
      const b = canvas.boards[commentBox.file];
      Object.assign(commentBox.el.style, {
        left: Math.min(innerWidth - 270, view.x + (b.x + commentBox.x) * view.s + 8) + 'px',
        top: Math.min(innerHeight - 150, view.y + (b.y + commentBox.y) * view.s + 8) + 'px',
      });
      overlay.append(commentBox.el);
    }
    if (picked?.note) {
      // A title, picked: its box, and a handle at each corner and side, as Figma's text.
      const el = world.querySelector(`.note[data-note="${CSS.escape(picked.note)}"]`);
      if (!el) { picked = null; return; }
      const er = el.getBoundingClientRect(), or = overlay.getBoundingClientRect();
      const r = { x: er.left - or.left, y: er.top - or.top, w: er.width, h: er.height };
      box(r, 'picked');
      if (renaming) return;
      for (const [kind, fx, fy] of [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5], ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]]) {
        const h = document.createElement('div');
        h.className = 'handle ' + kind;
        h.dataset.kind = kind;
        Object.assign(h.style, { left: r.x + r.w * fx + 'px', top: r.y + r.h * fy + 'px' });
        overlay.append(h);
      }
      return;
    }
    if (!picked || !canvas?.boards[picked.file]) return;
    const r = rectOf(picked.file, picked.el);
    if (picked.el) {
      box(r, 'picked');
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = nameOf(picked.el);
      Object.assign(tag.style, { left: r.x + 'px', top: r.y + 'px' });
      overlay.append(tag);
    }
    if (typing) return;
    for (const [kind, x, y] of [['e', r.x + r.w, r.y + r.h / 2], ['s', r.x + r.w / 2, r.y + r.h], ['se', r.x + r.w, r.y + r.h]]) {
      const h = document.createElement('div');
      h.className = 'handle ' + kind;
      h.dataset.kind = kind;
      Object.assign(h.style, { left: x + 'px', top: y + 'px' });
      overlay.append(h);
    }
  }

  let pickedId = null;  // where the picked element is in its page, to pick it again after a reload
  let layersOf = null;  // the screen whose layers Helmy shows

  function pick(next) {
    if (next?.el !== picked?.el || next?.file !== picked?.file) flushEdit();
    picked = next;
    if (picked?.el) pickedId = idOf(picked.el); else pickedId = null;
    marks();
    report();
  }

  // ---- What is picked, told to Helmy's inspector --------------------------------

  /** An element's place in its page: the child at each level below the body, "0.3.1". */
  function idOf(el) {
    const parts = [];
    for (let e = el; e?.parentElement && e.tagName !== 'BODY'; e = e.parentElement) {
      parts.unshift([...e.parentElement.children].indexOf(e));
    }
    return parts.join('.');
  }

  function elOf(file, id) {
    let e = docOf(file)?.body;
    if (!e || id == null || id === '') return null;
    for (const i of id.split('.').map(Number)) e = e?.children[i];
    return e ?? null;
  }

  const unseen = new Set(['SCRIPT', 'STYLE', 'META', 'LINK', 'NOSCRIPT', 'TEMPLATE', 'TITLE', 'BASE']);

  /** What a layer is called, as a design tool names it. */
  function layerName(el) {
    const tag = el.tagName.toLowerCase();
    const words = ownText(el).replace(/\s+/g, ' ');
    if (tag === 'svg') return 'Graphic';
    if (tag === 'img') return 'Image' + (el.alt ? ` "${el.alt.slice(0, 30)}"` : '');
    if (['input', 'textarea', 'select'].includes(tag)) return 'Field' + (el.placeholder ? ` "${el.placeholder.slice(0, 30)}"` : '');
    if (tag === 'button' || (tag === 'a' && words)) return (tag === 'a' ? 'Link' : 'Button') + (words ? ` "${words.slice(0, 30)}"` : '');
    if (words) return `Text "${words.slice(0, 30)}"`;
    return el.children.length ? 'Group' : 'Box';
  }

  /** A screen's elements, as Helmy's layer list shows them. */
  function layers(file) {
    const body = docOf(file)?.body;
    if (!body) return [];
    let count = 0;
    const walk = (el, depth) => {
      const out = [];
      [...el.children].forEach((c, i) => {
        if (unseen.has(c.tagName) || count > 3000) return;
        count++;
        const node = { id: idOf(c), name: layerName(c), tag: c.tagName.toLowerCase() };
        if (depth < 40 && c.tagName !== 'svg' && c.tagName.toLowerCase() !== 'svg') {
          const kids = walk(c, depth + 1);
          if (kids.length) node.n = kids;
        }
        out.push(node);
      });
      return out;
    };
    return walk(body, 0);
  }

  // What the inspector reads and sets, as CSS has them.
  const inspected = [
    'color', 'font-family', 'font-size', 'font-weight', 'font-style', 'text-decoration-line', 'text-align',
    'line-height', 'letter-spacing', 'text-transform',
    'width', 'height', 'min-width', 'max-width', 'min-height', 'max-height',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left', 'gap',
    'background-color', 'border-top-left-radius', 'border-top-width', 'border-top-style', 'border-top-color',
    'display', 'flex-direction', 'justify-content', 'align-items', 'flex-wrap', 'flex-grow', 'align-self',
    'position', 'top', 'right', 'bottom', 'left', 'z-index', 'overflow', 'opacity', 'box-shadow', 'transform', 'filter',
  ];

  let issues = [];  // what won't convert to Flutter: { file, selector, what, why }

  /** How it is sized on [axis] ('width' or 'height'): to its content, a fixed size, or filling its parent. */
  function sizing(el, axis) {
    const inline = el.style.getPropertyValue(axis);
    const cs = el.ownerDocument.defaultView.getComputedStyle(el);
    const parent = el.parentElement ? el.ownerDocument.defaultView.getComputedStyle(el.parentElement) : null;
    if (/px$/.test(inline)) return 'fixed';
    if (/content$/.test(inline)) return 'hug';
    if (inline === '100%') return 'fill';
    const flex = parent && /flex/.test(parent.display);
    if (flex) {
      const main = parent.flexDirection.startsWith('row') ? 'width' : 'height';
      if (axis === main) return parseFloat(cs.flexGrow) > 0 ? 'fill' : 'hug';
      const stretch = cs.alignSelf === 'stretch' || (cs.alignSelf === 'auto' && ['normal', 'stretch'].includes(parent.alignItems));
      return stretch && !inline ? 'fill' : 'hug';
    }
    if (axis === 'width' && ['block', 'flex', 'grid', 'list-item', 'table'].includes(cs.display) && !['absolute', 'fixed'].includes(cs.position)) return 'fill';
    return 'hug';
  }

  /** Tells Helmy what is picked: its layers, its styles, and what of it won't convert. */
  function report() {
    if (!picked || picked.note || !canvas?.boards?.[picked.file]) {
      if (layersOf !== null) { layersOf = null; tell({ layers: null }); }
      tell({ selected: null });
      return;
    }
    const file = picked.file;
    if (layersOf !== file) { layersOf = file; tell({ layers: { file, screen: canvas.boards[file].title ?? file, tree: layers(file) } }); }
    const el = picked.el;
    if (!el) { tell({ selected: { file, screen: true, scripted: scripted.has(file) } }); return; }
    const cs = el.ownerDocument.defaultView.getComputedStyle(el);
    const styles = {}, inline = {};
    for (const p of inspected) {
      styles[p] = cs.getPropertyValue(p);
      const v = el.style.getPropertyValue(p);
      if (v) inline[p] = v;
    }
    const parents = [];
    for (let e = el.parentElement; e && e.tagName !== 'BODY' && e.tagName !== 'HTML'; e = e.parentElement) {
      parents.unshift({ id: idOf(e), name: layerName(e) });
    }
    const doc = el.ownerDocument;
    const mine = issues.filter((i) => i.file === file && i.selector !== 'style' && (() => {
      try { return doc.querySelector(i.selector) === el; } catch (_) { return false; }
    })()).map((i) => ({ what: i.what, why: i.why }));
    const r = el.getBoundingClientRect();
    tell({ selected: {
      file, id: idOf(el), tag: el.tagName.toLowerCase(), name: layerName(el), path: pathOf(el), parents,
      // Words only where the element holds nothing but them.
      text: !el.children.length && typeable(el) ? el.textContent : null,
      html: el.outerHTML.length > 60000 ? null : el.outerHTML,
      size: { w: Math.round(r.width), h: Math.round(r.height) },
      sizing: { width: sizing(el, 'width'), height: sizing(el, 'height') },
      parentFlex: !!(el.parentElement && /flex/.test(doc.defaultView.getComputedStyle(el.parentElement).display)),
      styles, inline, issues: mine, scripted: scripted.has(file),
    } });
  }

  /** The layers again, after what is in a screen changed. */
  function relayer() { layersOf = null; report(); }

  // ---- The inspector's changes -------------------------------------------------

  let edit = null; // a run of changes to one element, saved once it stops: { file, el, before, timer }

  function flushEdit() {
    const e = edit;
    if (!e) return;
    edit = null;
    clearTimeout(e.timer);
    save(e.file, e.before);
  }

  /** Changes [el] by [change], saved with the rest of the run once the inspector rests. */
  function editPicked(change) {
    const el = picked?.el;
    if (!el) return;
    if (!edit || edit.el !== el) { flushEdit(); edit = { file: picked.file, el, before: sourceOf(picked.file) }; }
    change(el);
    fitHeight(picked.file);
    marks();
    report();
    clearTimeout(edit.timer);
    const e = edit;
    e.timer = setTimeout(() => { if (edit === e) flushEdit(); }, 600);
  }

  function setStyles(map) {
    editPicked((el) => {
      for (const [k, v] of Object.entries(map)) {
        if (v == null || v === '') el.style.removeProperty(k); else el.style.setProperty(k, String(v));
      }
      if (!el.getAttribute('style')) el.removeAttribute('style');
    });
  }

  /** Sizes the picked element on [axis] to its content ('hug'), [px] ('fixed') or its parent ('fill'). */
  function setSizing(axis, mode, px) {
    editPicked((el) => {
      const doc = el.ownerDocument, parent = el.parentElement ? doc.defaultView.getComputedStyle(el.parentElement) : null;
      const flex = parent && /flex/.test(parent.display);
      const main = flex && (parent.flexDirection.startsWith('row') ? 'width' : 'height') === axis;
      const r = el.getBoundingClientRect();
      if (mode === 'fixed') {
        el.style.setProperty(axis, Math.round(px ?? (axis === 'width' ? r.width : r.height)) + 'px');
        if (main) el.style.setProperty('flex-grow', '0');
      } else if (mode === 'hug') {
        el.style.setProperty(axis, 'fit-content');
        if (main) el.style.setProperty('flex-grow', '0');
        else if (flex && el.style.getPropertyValue('align-self') === 'stretch') el.style.removeProperty('align-self');
      } else if (main) {
        el.style.removeProperty(axis);
        el.style.setProperty('flex-grow', '1');
        el.style.setProperty('flex-basis', '0');
      } else if (flex) {
        el.style.removeProperty(axis);
        el.style.setProperty('align-self', 'stretch');
      } else {
        el.style.setProperty(axis, '100%');
      }
    });
  }

  function setText(text) {
    const el = picked?.el;
    if (!el || el.children.length) return;
    editPicked((e) => { e.textContent = text; });
  }

  /** The picked element replaced by [html], as written in the inspector's code. */
  function setHtml(html) {
    const el = picked?.el;
    if (!el) return;
    const file = picked.file, before = sourceOf(file);
    flushEdit();
    const tpl = el.ownerDocument.createElement('template');
    tpl.innerHTML = String(html).trim();
    const next = tpl.content.firstElementChild;
    if (!next || tpl.content.children.length !== 1) {
      tell({ problem: 'That code has to be one element, as the one it replaces is.' });
      return;
    }
    el.replaceWith(next);
    fitHeight(file);
    save(file, before);
    picked = { file, el: next };
    pickedId = idOf(next);
    layersOf = null;
    marks();
    report();
  }

  // ---- Saving ---------------------------------------------------------

  /** A screen's page as its file, without what editing added. */
  function sourceOf(file) {
    const doc = docOf(file);
    if (!doc) return null;
    const html = doc.documentElement.cloneNode(true);
    for (const el of html.querySelectorAll('[contenteditable]')) el.removeAttribute('contenteditable');
    return (doc.doctype ? '<!doctype html>\n' : '') + html.outerHTML + '\n';
  }

  /** FNV-1a over the UTF-8 bytes, as DesignServer has it: which version of a file a save is over. */
  const fnv = (s) => {
    let h = 0x811c9dc5;
    for (const b of new TextEncoder().encode(s)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  };

  /** Each file as last read or written here, by name: a save goes over it or not at all. */
  const bases = new Map();

  /** Writes [file]; false when it was not written. Refused when the file
   *  changed since it was read here (the agent wrote it): what the agent
   *  wrote stands, and shows. */
  async function put(file, text) {
    const headers = bases.has(file) ? { 'X-Helmy-Base': fnv(bases.get(file)) } : {};
    let r;
    try {
      r = await fetch(base + file, { method: 'PUT', body: text, headers });
    } catch (_) {
      tell({ problem: "That change wasn't saved: Helmy couldn't write " + file + '.' });
      return false;
    }
    if (r.status === 409) {
      const name = canvas?.boards?.[file]?.title ?? file;
      tell({ problem: `Helmy changed ${name} while you were editing it, so your change wasn't saved. It shows Helmy's version now.` });
      if (file === 'canvas.json') load(true); else reloadScreen(file);
      return false;
    }
    if (!r.ok) {
      tell({ problem: "That change wasn't saved: Helmy couldn't write " + file + '.' });
      return false;
    }
    bases.set(file, text);
    tell({ saved: file });
    return true;
  }

  function reloadScreen(file) {
    boards.get(file)?.querySelector('iframe').setAttribute('src', base + file + '?v=' + Date.now());
  }

  /** Saves [file] as it now is; [before] is what an undo puts back. A page
   *  its own script builds is not written over (that would write what the
   *  script made into the file, and the script would make it again): its
   *  changes go to Helmy as a request instead. */
  async function save(file, before) {
    if (scripted.has(file)) return askForChanges(file);
    const text = sourceOf(file);
    if (text == null || text === before) return;
    if (await put(file, text)) undos.push({ file, text: before });
  }

  // ---- Pages their own script builds ----------------------------------------

  /** Screens whose page is not what their file holds: a script made it. */
  const scripted = new Set();
  /** Such a screen's elements as first drawn, their style and words, to tell a change by. */
  const firstSeen = new Map(); // file -> { all: [el], was: WeakMap(el -> { style, text }) }

  const ownText = (el) => [...el.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join('').trim();

  function remember(file) {
    const body = docOf(file)?.body;
    if (!body) return;
    const all = [...body.getElementsByTagName('*')], was = new WeakMap();
    for (const el of all) was.set(el, { style: el.getAttribute('style') ?? '', text: ownText(el) });
    firstSeen.set(file, { all, was });
  }

  /** Reads [file] as it is on disk: the version saves go over, and whether its page is its own. */
  async function learn(file) {
    try {
      const r = await fetch(base + file, { cache: 'no-store' });
      if (!r.ok) return;
      const text = await r.text();
      bases.set(file, text);
      const body = docOf(file)?.body;
      const parsed = new DOMParser().parseFromString(text, 'text/html').body;
      const made = body && parsed && body.getElementsByTagName('*').length !== parsed.getElementsByTagName('*').length;
      if (made) { scripted.add(file); remember(file); } else { scripted.delete(file); firstSeen.delete(file); }
      if (picked?.file === file) report();
    } catch (_) { /* read again on its next load */ }
  }

  const styleMap = (s) => Object.fromEntries((s ?? '').split(';').map((d) => d.split(':')).filter((p) => p.length >= 2)
    .map(([k, ...v]) => [k.trim(), v.join(':').trim()]).filter(([k]) => k));

  /** What changed on a scripted screen since it was drawn, in words, sent to Helmy to make. */
  function askForChanges(file) {
    const seen = firstSeen.get(file), body = docOf(file)?.body;
    if (!seen || !body) return;
    const changes = [];
    const about = (el) => {
      const words = (el.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 40);
      return `the ${el.tagName.toLowerCase()}${words ? ` "${words}"` : ''} at ${pathOf(el)}`;
    };
    for (const el of body.getElementsByTagName('*')) {
      const was = seen.was.get(el);
      if (!was) continue;
      const a = styleMap(was.style), b = styleMap(el.getAttribute('style'));
      const props = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter((k) => a[k] !== b[k] && k !== 'contenteditable');
      if (props.length) changes.push(`${about(el)}: ` + props.map((k) => `${k} ${b[k] ? 'to ' + b[k] : 'removed'}${a[k] ? ` (was ${a[k]})` : ''}`).join(', '));
      const t = ownText(el);
      if (t !== was.text) changes.push(`${about(el)}: its text to "${t}" (was "${was.text}")`);
    }
    for (const el of seen.all) if (!el.isConnected) changes.push(`remove the ${el.tagName.toLowerCase()} that said "${was(el)}"`);
    function was(el) { return (seen.was.get(el)?.text ?? '').slice(0, 40); }
    if (!changes.length) return;
    const b = canvas.boards[file];
    tell({ ask: { file, screen: b?.title ?? file, changes } });
    remember(file); // what is asked for now is the new starting point
  }

  const indexText = () => JSON.stringify(canvas, null, 2) + '\n';

  async function saveIndex(before) {
    const text = indexText();
    if (text === before) return;
    if (await put('canvas.json', text)) undos.push({ file: 'canvas.json', text: before });
  }

  async function undo() {
    flushEdit();
    const u = undos.pop();
    if (!u) return;
    if (!(await put(u.file, u.text))) return;
    if (u.file === 'canvas.json') {
      canvas = JSON.parse(u.text);
      draw([]);
    } else {
      reloadScreen(u.file);
    }
    pick(null);
  }

  // ---- Renaming: a screen's name, or a title on the canvas ------------------

  let renaming = null; // { el, done(keep) }

  /** Puts [el]'s words up for change; [keep] has the new ones (trimmed). */
  function rename(el, keep) {
    if (renaming) renaming.done(true);
    const before = el.textContent;
    const index = indexText();
    el.contentEditable = 'plaintext-only';
    el.dataset.renaming = '';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    tell({ typing: true });
    const keys = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); done(true); }
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
      e.stopPropagation();
    };
    const blur = () => done(true);
    function done(ok) {
      if (renaming?.el !== el) return;
      renaming = null;
      el.removeEventListener('keydown', keys);
      el.removeEventListener('blur', blur);
      el.removeAttribute('contenteditable');
      delete el.dataset.renaming;
      getSelection().removeAllRanges();
      tell({ typing: false });
      marks(); // and come back after
      const text = el.textContent.trim();
      if (!ok || !text || text === before.trim()) { el.textContent = before; return; }
      keep(text);
      saveIndex(index);
      stage.focus();
    }
    el.addEventListener('keydown', keys);
    el.addEventListener('blur', blur);
    renaming = { el, done };
    marks(); // a picked title's handles go while its words are edited
  }

  // ---- Previewing a screen on its own --------------------------------------

  const present = document.createElement('div');
  present.id = 'present';
  document.body.append(present);
  let presenting = null; // { file, iframe }

  /** A device's height for a screen: the width is the screen's own. */
  const deviceHeight = (kind) => ({ phone: 844, tablet: 1194, desktop: 900 }[kind]);

  /** ▶ on [file]: Present (a window of its own) or Preview (over the canvas). */
  function playIt(file) {
    const b = canvas.boards[file];
    if (!b) return;
    if (windows && playMode === 'present') {
      tell({ present: { file, title: b.title ?? file, device: deviceOf(b), w: b.w, h: deviceHeight(deviceOf(b)) } });
    } else {
      preview(file);
    }
  }

  /**
   * This window presents [file] and nothing else (Present). A phone or tablet
   * screen is in its device, fitted to the window or at its actual size; a
   * desktop one is the window, its page reflowing as the window is resized.
   */
  function presentPage(file) {
    const b = canvas.boards[file];
    if (!b) { empty.style.display = 'grid'; empty.textContent = 'This screen is no longer in the design.'; return; }
    const kind = deviceOf(b);
    const h = deviceHeight(kind);
    document.title = b.title ?? file;
    present.innerHTML = '';
    present.className = 'window ' + kind;
    const bar = document.createElement('div');
    bar.className = 'bar';
    const device = document.createElement('div');
    device.className = 'device ' + kind;
    const iframe = document.createElement('iframe');
    iframe.src = base + file;
    iframe.title = b.title ?? file;
    device.append(iframe);
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = b.title ?? file;
    bar.append(
      button('back', 'Back', () => iframe.contentWindow?.history.back()),
      button('forward', 'Forward', () => iframe.contentWindow?.history.forward()),
      button('restart', 'Reload', () => { iframe.src = base + file + '?v=' + Date.now(); }),
      title,
    );
    if (kind !== 'desktop') {
      // Fitted to the window, or at its actual size (scrolled when larger).
      let actual = false;
      Object.assign(device.style, { width: b.w + 'px', height: h + 'px' });
      const border = kind === 'phone' ? 24 : 32;
      const fitDevice = () => {
        device.classList.toggle('actual', actual);
        if (actual) { device.style.transform = ''; return; }
        const s = Math.min(1, (innerWidth - 48) / (b.w + border), (innerHeight - 80) / (h + border));
        device.style.transform = `translate(-50%, -50%) translateY(18px) scale(${s})`;
      };
      const size = button('size', 'Actual size', () => {
        actual = !actual;
        size.title = actual ? 'Fit to window' : 'Actual size';
        size.setAttribute('aria-label', size.title);
        fitDevice();
      });
      bar.append(size);
      fitDevice();
      addEventListener('resize', fitDevice);
    }
    present.append(bar, device);
    present.classList.add('on');
  }

  /** [file] on its own, working (links go to the other screens), in its device. */
  function preview(file) {
    const b = canvas.boards[file];
    if (!b) return;
    const kind = deviceOf(b);
    // The screen as a device shows it: its width, and a device's height.
    const h = deviceHeight(kind);
    present.innerHTML = '';
    const bar = document.createElement('div');
    bar.className = 'bar';
    const device = document.createElement('div');
    device.className = 'device ' + kind;
    const iframe = document.createElement('iframe');
    iframe.src = base + file;
    iframe.title = b.title ?? file;
    device.append(iframe);
    Object.assign(device.style, { width: b.w + 'px', height: h + 'px' });
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = b.title ?? file;
    bar.append(
      button('back', 'Back', () => iframe.contentWindow?.history.back()),
      button('forward', 'Forward', () => iframe.contentWindow?.history.forward()),
      button('restart', 'Start again', () => { iframe.src = base + file + '?v=' + Date.now(); }),
      title,
      button('open', 'Open in a browser tab', () => tell({ open: new URL(iframe.contentWindow?.location.href ?? base + file, location.href).href })),
      button('close', 'Close (Esc)', closePreview),
    );
    present.append(bar, device);
    const fitDevice = () => {
      const border = kind === 'phone' ? 24 : kind === 'tablet' ? 32 : 0;
      const s = Math.min(1, (innerWidth - 48) / (b.w + border), (innerHeight - 72) / (h + border));
      device.style.transform = `translate(-50%, -50%) translateY(18px) scale(${s})`;
    };
    fitDevice();
    addEventListener('resize', fitDevice);
    presenting = { file, iframe, off: () => removeEventListener('resize', fitDevice) };
    present.classList.add('on');
    // The page has the keyboard (its fields); Esc still closes it.
    tell({ typing: true });
    iframe.addEventListener('load', () => {
      iframe.contentWindow?.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreview(); });
    });
  }

  function closePreview() {
    if (!presenting) return;
    presenting.off();
    presenting = null;
    present.classList.remove('on');
    present.innerHTML = '';
    tell({ typing: false });
    stage.focus();
  }

  // ---- Typing into a screen --------------------------------------------

  const typeable = (el) => !['INPUT', 'TEXTAREA', 'SELECT', 'IMG', 'SVG', 'VIDEO', 'IFRAME'].includes(el.tagName.toUpperCase()) &&
    [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());

  function startTyping(file, el) {
    const iframe = boards.get(file).querySelector('iframe');
    typing = { file, el, before: sourceOf(file), html: el.innerHTML, iframe };
    tell({ typing: true });
    pick({ file, el });
    el.contentEditable = 'true';
    iframe.style.pointerEvents = 'auto';
    iframe.focus();
    el.focus();
    const doc = el.ownerDocument, range = doc.createRange();
    range.selectNodeContents(el);
    doc.getSelection().removeAllRanges();
    doc.getSelection().addRange(range);
    const keys = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); stopTyping(true); }
      if (e.key === 'Escape') { e.preventDefault(); stopTyping(false); }
    };
    const blur = () => stopTyping(true);
    // On the page: the key comes to the page's focus, not always the element.
    doc.addEventListener('keydown', keys, true);
    el.addEventListener('blur', blur);
    typing.off = () => { doc.removeEventListener('keydown', keys, true); el.removeEventListener('blur', blur); };
  }

  function stopTyping(keep) {
    const t = typing;
    if (!t) return;
    typing = null;
    tell({ typing: false });
    t.off();
    if (!keep) t.el.innerHTML = t.html;
    t.el.removeAttribute('contenteditable');
    t.el.ownerDocument.getSelection()?.removeAllRanges();
    t.iframe.style.pointerEvents = 'none';
    stage.focus();
    if (keep && t.el.innerHTML !== t.html) save(t.file, t.before);
    marks();
    report();
  }

  // ---- The pointer --------------------------------------------------------

  let drag = null;

  /** Pans, or with ⌘ or a pinch zooms, at (cx, cy) on the canvas. */
  function wheel(e, cx, cy) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), cx, cy);
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }

  stage.addEventListener('wheel', (e) => wheel(e, e.clientX, e.clientY), { passive: false });

  stage.addEventListener('pointerdown', (e) => {
    tell({ active: true }); // Helmy hands the keys over to the canvas
    if (e.target.closest('button')) return;
    stage.focus();
    if (typing) stopTyping(true);
    if (commentBox) closeComment();
    const start = { cx: e.clientX, cy: e.clientY };
    const panning = tool === 'hand' || space || e.button === 1;
    const handle = e.target.closest('.handle');
    const strip = e.target.closest('.strip');
    const noteEl = e.target.closest('.note');
    if (!panning && handle && picked?.note) {
      // A title's box resized by a handle: its size as drawn, in the canvas's units.
      const n = canvas.notes[picked.note], el = world.querySelector(`.note[data-note="${CSS.escape(picked.note)}"]`);
      drag = { kind: 'noteSize', side: handle.dataset.kind, ...start, key: picked.note,
        x: n.x, y: n.y, w: el.offsetWidth, h: el.offsetHeight, before: indexText() };
    } else if (!panning && tool === 'select' && noteEl && !renaming) {
      // A title: picked, and moved when dragged.
      const key = noteEl.dataset.note, n = canvas.notes[key];
      pick({ note: key });
      drag = { kind: 'note', ...start, key, x: n.x, y: n.y, before: indexText() };
    } else if (!panning && handle && picked) {
      // Resizing what is picked: an element by its inline size, a screen by its frame.
      const r = picked.el ? picked.el.getBoundingClientRect() : canvas.boards[picked.file];
      drag = { kind: 'size', side: handle.dataset.kind, ...start, file: picked.file, el: picked.el,
        w: picked.el ? r.width : r.w, h: picked.el ? r.height : r.h,
        before: picked.el ? sourceOf(picked.file) : indexText() };
    } else if (!panning && strip) {
      // A screen dragged by its name.
      const file = strip.parentElement.dataset.file, b = canvas.boards[file];
      pick({ file, el: null });
      drag = { kind: 'screen', ...start, file, x: b.x, y: b.y, before: indexText() };
    } else if (!panning && tool === 'comment' && screenAt(e.clientX, e.clientY)) {
      const at = screenAt(e.clientX, e.clientY);
      openComment(at.file, elementAt(at.file, at.x, at.y), at.x, at.y);
      return;
    } else if (!panning && tool === 'select' && screenAt(e.clientX, e.clientY)) {
      const at = screenAt(e.clientX, e.clientY);
      const el = elementAt(at.file, at.x, at.y);
      pick({ file: at.file, el });
      if (el) {
        const cs = el.ownerDocument.defaultView.getComputedStyle(el);
        drag = { kind: 'element', ...start, file: at.file, el, static: cs.position === 'static',
          left: parseFloat(el.style.left) || 0, top: parseFloat(el.style.top) || 0, before: sourceOf(at.file) };
      } else {
        const b = canvas.boards[at.file];
        drag = { kind: 'screen', ...start, file: at.file, x: b.x, y: b.y, before: indexText() };
      }
    } else {
      if (!panning && tool === 'select') pick(null);
      drag = { kind: 'pan', ...start, x: view.x, y: view.y };
      stage.classList.add('panning');
    }
    stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener('pointermove', (e) => {
    if (!drag) {
      if ((tool !== 'select' && tool !== 'comment') || space || typing || commentBox) return;
      const at = screenAt(e.clientX, e.clientY);
      const next = at ? { file: at.file, el: elementAt(at.file, at.x, at.y) } : null;
      if (next?.file !== hover?.file || next?.el !== hover?.el) { hover = next?.el ? next : null; marks(); }
      return;
    }
    const dx = e.clientX - drag.cx, dy = e.clientY - drag.cy;
    // A click's jiggle is not a drag.
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    const wx = dx / view.s, wy = dy / view.s;
    switch (drag.kind) {
      case 'pan':
        view.x = drag.x + dx; view.y = drag.y + dy; apply(); return;
      case 'screen': {
        const b = canvas.boards[drag.file];
        b.x = Math.round(drag.x + wx); b.y = Math.round(drag.y + wy);
        place(drag.file); break;
      }
      case 'element':
        if (drag.static) drag.el.style.position = 'relative';
        drag.el.style.left = Math.round(drag.left + wx) + 'px';
        drag.el.style.top = Math.round(drag.top + wy) + 'px';
        break;
      case 'note': {
        const n = canvas.notes[drag.key];
        n.x = Math.round(drag.x + wx); n.y = Math.round(drag.y + wy);
        placeNote(drag.key);
        break;
      }
      case 'noteSize': {
        // Figma's text box: a side sets the width and the lines wrap to it (its
        // height follows them); the top, the bottom or a corner fixes both.
        // The type keeps its size.
        const n = canvas.notes[drag.key], side = drag.side;
        let { x, y, w, h } = drag;
        if (side.includes('e')) w = drag.w + wx;
        if (side.includes('w')) { w = drag.w - wx; x = drag.x + (drag.w - Math.max(40, w)); }
        if (side.includes('s')) h = drag.h + wy;
        if (side.includes('n')) { h = drag.h - wy; y = drag.y + (drag.h - Math.max(20, h)); }
        n.x = Math.round(x); n.y = Math.round(y);
        n.w = Math.round(Math.max(40, w));
        if (side === 'e' || side === 'w') delete n.h; else n.h = Math.round(Math.max(20, h));
        placeNote(drag.key);
        break;
      }
      case 'size': {
        const w = Math.max(drag.el ? 4 : 40, Math.round(drag.w + (drag.side === 's' ? 0 : wx)));
        const h = Math.max(drag.el ? 4 : 40, Math.round(drag.h + (drag.side === 'e' ? 0 : wy)));
        if (drag.el) {
          if (drag.side !== 's') drag.el.style.width = w + 'px';
          if (drag.side !== 'e') drag.el.style.height = h + 'px';
        } else {
          const b = canvas.boards[drag.file];
          b.w = w; b.h = h; place(drag.file); apply();
        }
        break;
      }
    }
    marks();
  });

  const release = () => {
    const d = drag;
    drag = null;
    stage.classList.remove('panning');
    if (!d?.moved) return;
    if (d.kind === 'screen' || d.kind === 'note' || d.kind === 'noteSize' || (d.kind === 'size' && !d.el)) saveIndex(d.before);
    if (d.kind === 'element' || (d.kind === 'size' && d.el)) { save(d.file, d.before); report(); }
  };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', () => { if (!drag && hover) { hover = null; marks(); } });

  stage.addEventListener('dblclick', (e) => {
    if (tool !== 'select') return;
    drag = null;
    // A screen's name or a title under the pointer: renamed in place. Looked
    // up by where, since dragging by a name holds the pointer.
    const under = document.elementsFromPoint(e.clientX, e.clientY);
    const name = under.find((el) => el.classList?.contains('name') && el.closest('.strip'));
    const note = under.find((el) => el.classList?.contains('note'));
    if (name) {
      const file = name.closest('.board').dataset.file;
      return rename(name, (text) => { canvas.boards[file].title = text; draw([]); });
    }
    if (note?._note) {
      const n = note._note;
      return rename(note, (text) => { n.text = text; draw([]); });
    }
    const at = screenAt(e.clientX, e.clientY);
    if (!at) return;
    const el = elementAt(at.file, at.x, at.y);
    if (el && typeable(el)) startTyping(at.file, el);
    else fit(at.file);
  });

  // ---- Comments -----------------------------------------------------------

  /** Where [el] is in its page, as a selector the agent can find it by. */
  function pathOf(el) {
    const parts = [];
    for (let e = el; e && e.tagName && e.tagName !== 'BODY' && e.tagName !== 'HTML'; e = e.parentElement) {
      let part = e.tagName.toLowerCase();
      if (e.id) { parts.unshift(part + '#' + e.id); break; }
      const same = [...(e.parentElement?.children ?? [])].filter((c) => c.tagName === e.tagName);
      if (same.length > 1) part += `:nth-of-type(${same.indexOf(e) + 1})`;
      parts.unshift(part);
    }
    return ['body', ...parts].join(' > ');
  }

  function openComment(file, target, x, y) {
    closeComment();
    const b = canvas.boards[file];
    const el = document.createElement('div');
    el.className = 'cbox';
    const about = document.createElement('div');
    about.className = 'about';
    const words = target ? (target.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 60) : '';
    about.textContent = (b.title ?? file) + ' · ' + (target ? (words ? `${target.tagName.toLowerCase()} "${words}"` : target.tagName.toLowerCase()) : 'the whole screen');
    const text = document.createElement('textarea');
    text.placeholder = 'What should change here?';
    const row = document.createElement('div');
    row.className = 'row';
    const no = document.createElement('button');
    no.className = 'no'; no.textContent = 'Cancel';
    const go = document.createElement('button');
    go.className = 'go'; go.textContent = 'Add to message';
    row.append(no, go);
    el.append(about, text, row);
    for (const ev of ['pointerdown', 'wheel', 'dblclick']) el.addEventListener(ev, (e) => e.stopPropagation());
    no.addEventListener('click', () => closeComment());
    go.addEventListener('click', () => sendComment());
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComment(); }
      if (e.key === 'Escape') { e.preventDefault(); closeComment(); }
    });
    commentBox = { el, text, file, target, x, y };
    marks();
    tell({ typing: true }); // the keyboard to the box
    setTimeout(() => text.focus(), 0);
  }

  function closeComment() {
    if (!commentBox) return;
    commentBox.el.remove();
    commentBox = null;
    tell({ typing: false });
    stage.focus();
    marks();
  }

  function sendComment() {
    const c = commentBox;
    if (!c) return;
    const note = c.text.value.trim();
    if (!note) { closeComment(); return; }
    const b = canvas.boards[c.file];
    const key = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
    const words = c.target ? (c.target.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 80) : '';
    tell({ comment: {
      key, file: c.file, screen: b.title ?? c.file, note,
      element: c.target ? { tag: c.target.tagName.toLowerCase(), words, path: pathOf(c.target) } : null,
    } });
    pins.push({ key, file: c.file, x: c.x, y: c.y, n: ++pinCount });
    closeComment();
  }

  // ---- Keys ---------------------------------------------------------------

  let nudge = null; // a run of arrow presses, saved once it stops

  function up() {
    if (picked?.el) {
      const p = picked.el.parentElement;
      pick(p && p.tagName !== 'BODY' && p.tagName !== 'HTML' ? { file: picked.file, el: p } : { file: picked.file, el: null });
    } else if (picked) pick(null);
    else fit();
  }

  function setTool(next) {
    tool = next;
    stage.classList.toggle('hand', tool === 'hand' || space);
    stage.classList.toggle('commenting', tool === 'comment');
    if (tool !== 'comment') closeComment();
    hover = null;
    marks();
    tell({ tool });
  }

  function onKey(e) {
    if (presenting) { if (e.key === 'Escape') closePreview(); return; }
    if (renaming) {
      if (e.key === 'Enter' && !e.shiftKey) renaming.done(true);
      if (e.key === 'Escape') renaming.done(false);
      return;
    }
    if (commentBox) {
      if (e.key === 'Enter' && !e.shiftKey) sendComment();
      if (e.key === 'Escape') closeComment();
      return;
    }
    if (typing) {
      if (e.key === 'Enter' && !e.shiftKey) stopTyping(true);
      if (e.key === 'Escape') stopTyping(false);
      return;
    }
    const cmd = e.metaKey || e.ctrlKey;
    if (cmd && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (cmd && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomAt(1.25, innerWidth / 2, innerHeight / 2); return; }
    if (cmd && e.key === '-') { e.preventDefault(); zoomAt(0.8, innerWidth / 2, innerHeight / 2); return; }
    if (cmd) return;
    if (e.key === ' ' && !space) { space = true; stage.classList.add('hand'); e.preventDefault(); return; }
    if (e.key === 'v' || e.key === 'V') return setTool('select');
    if (e.key === 'h' || e.key === 'H') return setTool('hand');
    if (e.key === 'c' || e.key === 'C') return setTool('comment');
    if (e.shiftKey && e.key === '!') return fit();
    if (e.key === 'Escape') { up(); return; }
    if (e.key === 'Enter' && picked?.el && typeable(picked.el)) { e.preventDefault(); startTyping(picked.file, picked.el); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && picked?.el) {
      e.preventDefault();
      const { file, el } = picked, before = sourceOf(file);
      el.remove();
      pick({ file, el: null });
      save(file, before);
      relayer();
      return;
    }
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (arrows[e.key] && picked) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1, [ax, ay] = arrows[e.key];
      if (!nudge || nudge.file !== picked.file || nudge.el !== picked.el || nudge.note !== picked.note) {
        nudge = { file: picked.file, el: picked.el, note: picked.note, before: picked.el ? sourceOf(picked.file) : indexText() };
      }
      if (picked.note) {
        const n = canvas.notes[picked.note];
        if (n) { n.x += ax * step; n.y += ay * step; placeNote(picked.note); }
      } else if (picked.el) {
        const el = picked.el;
        if (el.ownerDocument.defaultView.getComputedStyle(el).position === 'static') el.style.position = 'relative';
        el.style.left = ((parseFloat(el.style.left) || 0) + ax * step) + 'px';
        el.style.top = ((parseFloat(el.style.top) || 0) + ay * step) + 'px';
      } else {
        const b = canvas.boards[picked.file];
        b.x += ax * step; b.y += ay * step; place(picked.file);
      }
      marks();
      clearTimeout(nudge.timer);
      const n = nudge;
      n.timer = setTimeout(() => {
        if (n.el) { save(n.file, n.before); report(); } else saveIndex(n.before);
        if (nudge === n) nudge = null;
      }, 400);
    }
  }
  function onKeyUp(e) {
    if (e.key === ' ') { space = false; stage.classList.toggle('hand', tool === 'hand'); }
  }
  addEventListener('keydown', onKey);
  addEventListener('keyup', onKeyUp);

  // What Helmy's toolbar and the folder watch call.
  window.HelmyCanvas = {
    reload: (changed) => load(changed ?? true),
    // What ▶ plays from now on, and, given a screen, played now.
    play: (mode, file) => {
      playMode = mode === 'present' && windows ? 'present' : 'preview';
      for (const b of document.querySelectorAll('.strip button.play')) {
        b.title = playLabel();
        b.setAttribute('aria-label', playLabel());
      }
      if (file) playIt(file);
    },
    fit: () => fit(),
    focus: (file) => fit(file),
    // A thing Helmy points at (it will not convert): its screen in view, it picked.
    show: (file, selector) => {
      fit(file);
      const el = selector === 'style' ? null : docOf(file)?.querySelector(selector);
      pick(el ? { file, el } : { file });
    },
    zoomIn: () => zoomAt(1.25, innerWidth / 2, innerHeight / 2),
    zoomOut: () => zoomAt(0.8, innerWidth / 2, innerHeight / 2),
    zoomTo: (s) => zoomAt(s / view.s, innerWidth / 2, innerHeight / 2),
    tool: (t) => setTool(t),
    // Helmy's inspector: a layer picked or pointed at, a level up, and changes to what is picked.
    select: (file, id) => { const el = elOf(file, id); if (el) pick({ file, el }); },
    point: (file, id) => { const el = file ? elOf(file, id) : null; hover = el ? { file, el } : null; marks(); },
    up: () => up(),
    style: (map) => setStyles(map),
    sizing: (axis, mode, px) => setSizing(axis, mode, px),
    text: (t) => setText(t),
    html: (h) => setHtml(h),
    issues: (list) => { issues = list ?? []; if (picked?.el) report(); },
    undo: () => undo(),
    // The comments still waiting to go, by key: the rest's pins go.
    pins: (keys) => { pins = pins.filter((p) => keys.includes(p.key)); if (!pins.length) pinCount = 0; marks(); },
    // A key Helmy caught for the canvas (macOS gives some to the app first).
    key: (key, shift, meta, up) => {
      const e = { key, shiftKey: shift, metaKey: meta, ctrlKey: false, preventDefault() {} };
      if (up) onKeyUp(e); else onKey(e);
    },
  };
  load();
})();
</script>
</body>
</html>
