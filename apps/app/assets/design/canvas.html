<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design</title>
<style>
  :root { --bg: #f2f2f0; --dot: #d6d6d2; --text: #1a1a1a; --muted: #6b6b66; --ring: #3b82f6; --strip-hover: #e2e2de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --dot: #262626; --text: #ededed; --muted: #8f8f8f; --ring: #60a5fa; --strip-hover: #222222; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Inter", sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: absolute; inset: 0; cursor: default; outline: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
  #stage.hand { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .board { position: absolute; }
  .strip { position: absolute; left: 0; bottom: 100%; height: 28px; display: flex; align-items: center;
    gap: 6px; color: var(--muted); white-space: nowrap; cursor: default; }
  .strip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .strip button { all: unset; width: 22px; height: 22px; border-radius: 5px; place-items: center;
    color: var(--muted); cursor: pointer; }
  /* Its buttons show on the screen under the pointer, so the name has the room. */
  .strip button { display: none; }
  .board:hover .strip button { display: grid; }
  .strip button:hover { background: var(--strip-hover); color: var(--text); }
  .strip svg { width: 14px; height: 14px; }
  .frame { position: absolute; inset: 0; overflow: hidden; background: #fff; border-radius: var(--radius, 0);
    box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.10); }
  .frame iframe { border: 0; width: 100%; height: 100%; display: block; pointer-events: none; background: #fff; }
  .board.picked .frame, .board.focused .frame { outline: 2px solid var(--ring); outline-offset: 2px; }
  .note { position: absolute; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; white-space: pre-wrap; }
  .note.sticky { font-weight: 400; font-size: 15px; letter-spacing: 0; padding: 12px; border-radius: 6px;
    background: #fde68a; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .box { position: absolute; box-sizing: border-box; border: 1px solid var(--ring); pointer-events: none; }
  .box.hover { opacity: .55; }
  .handle { position: absolute; width: 9px; height: 9px; box-sizing: border-box; margin: -4px 0 0 -4px;
    background: #fff; border: 1.5px solid var(--ring); border-radius: 2px; pointer-events: auto; }
  .handle.se { cursor: nwse-resize; }
  .handle.e { cursor: ew-resize; }
  .handle.s { cursor: ns-resize; }
  .tag { position: absolute; transform: translateY(-100%); margin-top: -4px; padding: 1px 5px; border-radius: 4px;
    background: var(--ring); color: #fff; font-size: 11px; white-space: nowrap; pointer-events: none; }
  #stage.commenting { cursor: crosshair; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -22px 0 0 0; border-radius: 11px 11px 11px 2px;
    background: var(--ring); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); pointer-events: none; }
  .cbox { position: absolute; width: 260px; padding: 10px; box-sizing: border-box; border-radius: 10px; pointer-events: auto;
    background: var(--bg); color: var(--text); border: 1px solid var(--dot); box-shadow: 0 8px 28px rgba(0,0,0,.28);
    display: flex; flex-direction: column; gap: 8px; -webkit-user-select: text; user-select: text; }
  .cbox .about { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbox textarea { font: inherit; font-size: 13px; resize: none; height: 64px; padding: 8px; border-radius: 6px; box-sizing: border-box;
    border: 1px solid var(--dot); background: transparent; color: var(--text); outline: none; }
  .cbox textarea:focus { border-color: var(--ring); }
  .cbox .row { display: flex; justify-content: flex-end; gap: 6px; }
  .cbox button { all: unset; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .cbox button.go { background: var(--ring); color: #fff; }
  .cbox button.no { color: var(--muted); }
  /* Devices: a bezel or a browser window round each screen, outside it,
     so the screen keeps its size. Shown with Frames on. */
  /* Over the screen (its notch shows on it); clicks pass through. */
  .chrome { position: absolute; pointer-events: none; display: none; box-sizing: border-box; z-index: 2; }
  #world.framed .chrome { display: block; }
  .board[data-device=phone] .chrome { inset: -12px; border: 12px solid #0b0b0b; border-radius: 54px;
    box-shadow: 0 0 0 1.5px #34343a, 0 18px 48px rgba(0,0,0,.35); }
  .board[data-device=phone] .island { position: absolute; top: 9px; left: 50%; width: 112px; height: 32px;
    margin-left: -56px; border-radius: 16px; background: #000; }
  #world.framed .board[data-device=phone] .frame { border-radius: 42px; }
  .board[data-device=tablet] .chrome { inset: -16px; border: 16px solid #0b0b0b; border-radius: 34px;
    box-shadow: 0 0 0 1.5px #34343a, 0 18px 48px rgba(0,0,0,.3); }
  #world.framed .board[data-device=tablet] .frame { border-radius: 18px; }
  .board[data-device=desktop] .chrome { inset: -38px -1px -1px -1px; border: 1px solid #3a3a3e; border-radius: 11px;
    box-shadow: 0 18px 48px rgba(0,0,0,.3); }
  .board[data-device=desktop] .bar { position: absolute; left: 0; right: 0; top: 0; height: 37px; background: #26262a;
    border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 7px; padding: 0 14px; box-sizing: border-box; }
  .bar i { width: 11px; height: 11px; border-radius: 6px; background: #4a4a50; }
  .bar span { margin: 0 auto; padding: 4px 18px; border-radius: 7px; background: #1a1a1d; color: #a0a0a8;
    font-size: 12px; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #world.framed .board[data-device=desktop] .frame { border-radius: 0 0 10px 10px; }
  .board:not([data-device=phone]) .island,
  .board:not([data-device=desktop]) .bar { display: none; }
  #world.framed .board[data-device=phone] .strip { bottom: calc(100% + 16px); }
  #world.framed .board[data-device=tablet] .strip { bottom: calc(100% + 20px); }
  #world.framed .board[data-device=desktop] .strip { bottom: calc(100% + 42px); }
  /* A web page drawn at a phone's, a tablet's or a desktop's width. */
  .strip .widths { display: none; gap: 2px; }
  .board.responsive:hover .strip .widths { display: flex; }
  .strip .widths button { display: block; width: auto; height: auto; padding: 2px 6px; font-size: 11px; }
  .strip .widths button.on { color: var(--text); background: var(--strip-hover); }
  #empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="stage" tabindex="0"><div id="world"></div><div id="overlay"></div></div>
<div id="empty"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const base = 'd/' + params.get('d') + '/';
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const overlay = document.getElementById('overlay');
  const empty = document.getElementById('empty');
  const icons = {
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  };
  let canvas = null;          // canvas.json as last read
  let view = { x: 0, y: 0, s: 1 };
  let fitted = false;
  let viewTold = 0;
  const boards = new Map();   // file -> element

  // Editing: the tool, what is under the pointer, what is picked, what is
  // being typed into, and what to undo.
  let tool = 'select';
  let space = false;
  let hover = null;           // { file, el }
  let picked = null;          // { file, el } (el null: the screen itself)
  let typing = null;          // { file, el, before, html }
  const undos = [];           // { file, text }
  let pins = [];              // comments waiting to go: { key, file, x, y, n }
  let pinCount = 0;
  let commentBox = null;      // { el (the box), file, target, x, y }

  const tell = (m) => { try { Helmy.postMessage(JSON.stringify(m)); } catch (_) {} };

  // ---- Drawing --------------------------------------------------------

  function apply() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
    // Where it is looked at, told once it rests, for Helmy to keep with the chat.
    clearTimeout(viewTold);
    viewTold = setTimeout(() => tell({ view: { x: Math.round(view.x), y: Math.round(view.y), s: view.s } }), 400);
    stage.style.backgroundSize = `${24 * view.s}px ${24 * view.s}px`;
    stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
    // The strips stay a readable size at any zoom, as wide as their screen,
    // but never taller than the room above their screen: zoomed out, a
    // name the same size on screen would cover what is above it.
    const room = roomAbove();
    for (const el of world.querySelectorAll('.strip')) {
      const fits = Math.max(room.get(el.parentElement.dataset.file) ?? Infinity, 10) / 28;
      const k = Math.min(1 / view.s, fits);
      el.style.transform = `scale(${k})`;
      el.style.width = (Number(el.dataset.w) / k) + 'px';
    }
    marks();
    tell({ zoom: view.s });
  }

  function bounds(only) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const add = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
    for (const [file, b] of Object.entries(canvas?.boards ?? {})) {
      if (only && file !== only) continue;
      add(b.x, b.y - 32, b.w, b.h + 32);
    }
    if (!only) for (const n of Object.values(canvas?.notes ?? {})) add(n.x, n.y, n.w ?? 400, n.size ?? 72);
    return x0 === Infinity ? null : { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  function fit(only) {
    const b = bounds(only);
    if (!b) return;
    const pad = 48;
    const s = Math.min((innerWidth - pad * 2) / b.w, (innerHeight - pad * 2) / b.h, only ? 2 : 1);
    view = { s, x: (innerWidth - b.w * s) / 2 - b.x * s, y: (innerHeight - b.h * s) / 2 - b.y * s };
    for (const [file, el] of boards) el.classList.toggle('focused', file === only);
    apply();
  }

  function zoomAt(factor, cx, cy) {
    const s = Math.min(4, Math.max(0.05, view.s * factor));
    view.x = cx - (cx - view.x) * (s / view.s);
    view.y = cy - (cy - view.y) * (s / view.s);
    view.s = s;
    apply();
  }

  function button(kind, label, onClick) {
    const b = document.createElement('button');
    b.innerHTML = icons[kind];
    b.title = label;
    b.setAttribute('aria-label', label);
    b.addEventListener('pointerdown', (e) => e.stopPropagation());
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    return b;
  }

  function place(file) {
    const b = canvas.boards[file], el = boards.get(file);
    if (!b || !el) return;
    Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    el.querySelector('.strip').dataset.w = b.w;
    el.dataset.device = deviceOf(b);
    for (const wb of el.querySelectorAll('.widths button')) wb.classList.toggle('on', Number(wb.dataset.w) === b.w);
  }

  /** What a screen is shown as: the device its index names, else one its width suggests. */
  const deviceOf = (b) => b.device ?? (b.w <= 500 ? 'phone' : b.w <= 1100 ? 'tablet' : 'desktop');

  /** A responsive page's height: its content's, at its width. */
  function fitHeight(file) {
    const b = canvas?.boards[file];
    if (!b?.responsive) return false;
    const doc = docOf(file);
    const h = Math.max(200, Math.ceil(doc?.documentElement.scrollHeight ?? 0));
    if (!doc || h === b.h) return false;
    b.h = h;
    place(file);
    unstack();
    apply();
    return true;
  }

  /**
   * Nothing drawn over anything else: a screen that grew as its page loaded,
   * or a title that wrapped onto more lines than its place had room for,
   * moves what is under it down, keeping a gap. Only ever down, and only what
   * overlaps (side by side is left alone); stickies sit where they are put.
   */
  /** Each screen's free height above it, up to what is over it, by file. */
  function roomAbove() {
    const out = new Map();
    const all = Object.entries(canvas?.boards ?? {});
    const others = [
      ...all.map(([file, b]) => ({ file, x: b.x, w: b.w, top: b.y, bottom: b.y + b.h })),
      ...[...world.querySelectorAll('.note:not(.sticky)')].filter((el) => el._note)
        .map((el) => ({ x: el._note.x, w: el._w ?? el.offsetWidth, top: el._note.y, bottom: el._note.y + (el._h ?? el.offsetHeight) })),
    ];
    for (const [file, b] of all) {
      let room = Infinity;
      for (const o of others) {
        if (o.file === file || !(b.x < o.x + o.w && o.x < b.x + b.w) || o.top >= b.y) continue;
        room = Math.min(room, Math.max(0, b.y - o.bottom));
      }
      out.set(file, room);
    }
    return out;
  }

  function unstack() {
    // A screen's name sits above it: room kept for it, so it can be read
    // zoomed out to about half.
    const GAP = 32, STRIP = 56;
    const items = [];
    for (const [file, b] of Object.entries(canvas?.boards ?? {})) {
      items.push({ x: b.x, w: b.w, top: b.y - STRIP, h: b.h + STRIP, move: (d) => { b.y += d; place(file); } });
    }
    for (const el of world.querySelectorAll('.note:not(.sticky)')) {
      const n = el._note;
      if (!n) continue;
      el._w = el.offsetWidth; el._h = el.offsetHeight;
      items.push({ x: n.x, w: el._w, top: n.y, h: el._h, move: (d) => { n.y += d; el.style.top = n.y + 'px'; } });
    }
    items.sort((a, b) => a.top - b.top || a.x - b.x);
    for (let i = 1; i < items.length; i++) {
      const it = items[i];
      let down = 0;
      for (let j = 0; j < i; j++) {
        const o = items[j], bottom = o.top + o.h;
        const across = it.x < o.x + o.w && o.x < it.x + it.w;
        if (across && bottom > it.top) down = Math.max(down, bottom + GAP - it.top);
      }
      if (down > 0) { it.top += down; it.move(down); }
    }
  }

  /** A responsive page drawn at [w] wide, kept in the index. */
  function widthTo(file, w) {
    const b = canvas.boards[file];
    if (!b || b.w === w) return;
    const before = indexText();
    b.w = w;
    place(file);
    apply();
    // Laid out again at the new width: then its height, then saved.
    requestAnimationFrame(() => requestAnimationFrame(() => { fitHeight(file); saveIndex(before); }));
  }

  function draw(changed) {
    const seen = new Set();
    const order = canvas.order ?? Object.keys(canvas.boards ?? {});
    for (const file of order) {
      const b = canvas.boards?.[file];
      if (!b) continue;
      seen.add(file);
      let el = boards.get(file);
      if (!el) {
        el = document.createElement('div');
        el.className = 'board';
        el.dataset.file = file;
        const strip = document.createElement('div');
        strip.className = 'strip';
        strip.style.transformOrigin = '0 100%';
        const name = document.createElement('span');
        name.className = 'name';
        strip.append(name,
          button('expand', 'Fit this screen', () => fit(file)),
          button('download', 'Save a copy', () => tell({ download: file })));
        const widths = document.createElement('span');
        widths.className = 'widths';
        for (const [label, w] of [['Phone', 390], ['Tablet', 834], ['Desktop', 1440]]) {
          const wb = document.createElement('button');
          wb.textContent = label;
          wb.dataset.w = w;
          wb.title = `Draw it ${w} wide`;
          wb.addEventListener('pointerdown', (e) => e.stopPropagation());
          wb.addEventListener('click', (e) => { e.stopPropagation(); widthTo(file, w); });
          widths.append(wb);
        }
        strip.insertBefore(widths, strip.children[1]);
        const chrome = document.createElement('div');
        chrome.className = 'chrome';
        const island = document.createElement('div');
        island.className = 'island';
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.innerHTML = '<i></i><i></i><i></i><span></span>';
        chrome.append(island, bar);
        el.append(chrome);
        const frame = document.createElement('div');
        frame.className = 'frame';
        const iframe = document.createElement('iframe');
        iframe.src = base + file;
        iframe.title = b.title ?? file;
        // A responsive page is as tall as what it holds at its width.
        iframe.addEventListener('load', () => fitHeight(file));
        frame.append(iframe);
        el.append(strip, frame);
        boards.set(file, el);
      } else if (changed === true || (changed ?? []).includes(file)) {
        if (typing?.file === file) continue; // being typed into: the person's text stands
        el.querySelector('iframe').src = base + file + '?v=' + Date.now();
        if (picked?.file === file) picked = { file, el: null };
      }
      place(file);
      el.style.setProperty('--radius', (b.radius ?? 0) + 'px');
      el.querySelector('.name').textContent = b.title ?? file.replace(/\.html?$/, '');
      el.querySelector('.bar span').textContent = b.title ?? file;
      el.classList.toggle('responsive', !!b.responsive);
      world.append(el); // back to front, in order
    }
    for (const [file, el] of boards) if (!seen.has(file)) { el.remove(); boards.delete(file); }
    for (const n of world.querySelectorAll('.note')) n.remove();
    for (const n of Object.values(canvas.notes ?? {})) {
      const el = document.createElement('div');
      el.className = 'note' + (n.kind === 'title' ? '' : ' sticky');
      el.textContent = n.text ?? '';
      el._note = n;
      Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px' });
      if (n.kind === 'title') el.style.fontSize = (n.size ?? 72) + 'px';
      if (n.w) el.style.width = n.w + 'px';
      world.prepend(el);
    }
    unstack();
    apply();
  }

  async function load(changed) {
    try {
      const r = await fetch(base + 'canvas.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('none');
      canvas = await r.json();
      empty.style.display = 'none';
      draw(changed);
      if (!fitted) {
        fitted = true;
        // Where this chat last looked, when Helmy kept it; else everything, fitted.
        const [x, y, s] = (params.get('v') ?? '').split(',').map(Number);
        if (s > 0 && Number.isFinite(x) && Number.isFinite(y)) { view = { x, y, s }; apply(); } else fit();
      }
      tell({ loaded: { title: canvas.title ?? '', screens: (canvas.order ?? Object.keys(canvas.boards ?? {})).map((f) => ({ file: f, title: canvas.boards?.[f]?.title ?? f })) } });
    } catch (e) {
      if (canvas) return; // keep what showed; the file is mid-write
      empty.style.display = 'grid';
      empty.textContent = e.message === 'none' ? 'No design here yet.' : "This design's index can't be read: " + e.message;
    }
  }

  // ---- Where things are -----------------------------------------------

  const toWorld = (cx, cy) => ({ x: (cx - view.x) / view.s, y: (cy - view.y) / view.s });

  /** The screen under a point on the canvas, front first, and the point on it. */
  function screenAt(cx, cy) {
    const p = toWorld(cx, cy);
    const order = canvas?.order ?? Object.keys(canvas?.boards ?? {});
    for (let i = order.length - 1; i >= 0; i--) {
      const b = canvas.boards[order[i]];
      if (b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        return { file: order[i], x: p.x - b.x, y: p.y - b.y };
      }
    }
    return null;
  }

  const docOf = (file) => {
    try { return boards.get(file)?.querySelector('iframe').contentDocument ?? null; } catch (_) { return null; }
  };

  /** The element at a point on a screen; null for the page itself, or for
   *  what fills it (the screen's own container counts as the screen). */
  function elementAt(file, x, y) {
    const doc = docOf(file);
    const el = doc?.elementFromPoint(x, y);
    if (!el || el === doc.body || el === doc.documentElement) return null;
    const b = canvas.boards[file], r = el.getBoundingClientRect();
    return r.width >= b.w * 0.95 && r.height >= b.h * 0.95 ? null : el;
  }

  /** Where [el] (on [file]) is on the canvas, in the canvas page's pixels. */
  function rectOf(file, el) {
    const b = canvas.boards[file];
    if (!el) return { x: view.x + b.x * view.s, y: view.y + b.y * view.s, w: b.w * view.s, h: b.h * view.s };
    const r = el.getBoundingClientRect();
    return { x: view.x + (b.x + r.left) * view.s, y: view.y + (b.y + r.top) * view.s, w: r.width * view.s, h: r.height * view.s };
  }

  const nameOf = (el) => {
    const tag = el.tagName.toLowerCase();
    const words = (el.textContent ?? '').trim().replace(/\s+/g, ' ');
    return words && words.length <= 24 ? `${tag} · ${words}` : tag;
  };

  /** Marks on the canvas: under the pointer, picked, with its handles. */
  function marks() {
    overlay.textContent = '';
    for (const [file, el] of boards) el.classList.toggle('picked', picked?.file === file && !picked.el);
    if (picked?.el && !picked.el.isConnected) picked = null;
    if (hover?.el && !hover.el.isConnected) hover = null;
    const box = (r, cls) => {
      const d = document.createElement('div');
      d.className = 'box ' + cls;
      Object.assign(d.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      overlay.append(d);
    };
    if (hover && !(picked && hover.file === picked.file && hover.el === picked.el) && !typing) box(rectOf(hover.file, hover.el), 'hover');
    for (const p of pins) {
      const b = canvas?.boards[p.file];
      if (!b) continue;
      const d = document.createElement('div');
      d.className = 'pin';
      d.textContent = p.n;
      Object.assign(d.style, { left: view.x + (b.x + p.x) * view.s + 'px', top: view.y + (b.y + p.y) * view.s + 'px' });
      overlay.append(d);
    }
    if (commentBox) {
      const b = canvas.boards[commentBox.file];
      Object.assign(commentBox.el.style, {
        left: Math.min(innerWidth - 270, view.x + (b.x + commentBox.x) * view.s + 8) + 'px',
        top: Math.min(innerHeight - 150, view.y + (b.y + commentBox.y) * view.s + 8) + 'px',
      });
      overlay.append(commentBox.el);
    }
    if (!picked || !canvas?.boards[picked.file]) return;
    const r = rectOf(picked.file, picked.el);
    if (picked.el) {
      box(r, 'picked');
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = nameOf(picked.el);
      Object.assign(tag.style, { left: r.x + 'px', top: r.y + 'px' });
      overlay.append(tag);
    }
    if (typing) return;
    for (const [kind, x, y] of [['e', r.x + r.w, r.y + r.h / 2], ['s', r.x + r.w / 2, r.y + r.h], ['se', r.x + r.w, r.y + r.h]]) {
      const h = document.createElement('div');
      h.className = 'handle ' + kind;
      h.dataset.kind = kind;
      Object.assign(h.style, { left: x + 'px', top: y + 'px' });
      overlay.append(h);
    }
  }

  function pick(next) {
    picked = next;
    marks();
  }

  // ---- Saving ---------------------------------------------------------

  /** A screen's page as its file, without what editing added. */
  function sourceOf(file) {
    const doc = docOf(file);
    if (!doc) return null;
    const html = doc.documentElement.cloneNode(true);
    for (const el of html.querySelectorAll('[contenteditable]')) el.removeAttribute('contenteditable');
    return (doc.doctype ? '<!doctype html>\n' : '') + html.outerHTML + '\n';
  }

  async function put(file, text) {
    try {
      await fetch(base + file, { method: 'PUT', body: text });
    } catch (_) {
      tell({ problem: "That change wasn't saved: Helmy couldn't write " + file + '.' });
    }
  }

  /** Saves [file] as it now is; [before] is what an undo puts back. */
  async function save(file, before) {
    const text = sourceOf(file);
    if (text == null || text === before) return;
    undos.push({ file, text: before });
    await put(file, text);
  }

  const indexText = () => JSON.stringify(canvas, null, 2) + '\n';

  async function saveIndex(before) {
    const text = indexText();
    if (text === before) return;
    undos.push({ file: 'canvas.json', text: before });
    await put('canvas.json', text);
  }

  async function undo() {
    const u = undos.pop();
    if (!u) return;
    await put(u.file, u.text);
    if (u.file === 'canvas.json') {
      canvas = JSON.parse(u.text);
      draw([]);
    } else {
      boards.get(u.file)?.querySelector('iframe').setAttribute('src', base + u.file + '?v=' + Date.now());
    }
    pick(null);
  }

  // ---- Typing into a screen --------------------------------------------

  const typeable = (el) => !['INPUT', 'TEXTAREA', 'SELECT', 'IMG', 'SVG', 'VIDEO', 'IFRAME'].includes(el.tagName.toUpperCase()) &&
    [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());

  function startTyping(file, el) {
    const iframe = boards.get(file).querySelector('iframe');
    typing = { file, el, before: sourceOf(file), html: el.innerHTML, iframe };
    tell({ typing: true });
    pick({ file, el });
    el.contentEditable = 'true';
    iframe.style.pointerEvents = 'auto';
    iframe.focus();
    el.focus();
    const doc = el.ownerDocument, range = doc.createRange();
    range.selectNodeContents(el);
    doc.getSelection().removeAllRanges();
    doc.getSelection().addRange(range);
    const keys = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); stopTyping(true); }
      if (e.key === 'Escape') { e.preventDefault(); stopTyping(false); }
    };
    const blur = () => stopTyping(true);
    // On the page: the key comes to the page's focus, not always the element.
    doc.addEventListener('keydown', keys, true);
    el.addEventListener('blur', blur);
    typing.off = () => { doc.removeEventListener('keydown', keys, true); el.removeEventListener('blur', blur); };
  }

  function stopTyping(keep) {
    const t = typing;
    if (!t) return;
    typing = null;
    tell({ typing: false });
    t.off();
    if (!keep) t.el.innerHTML = t.html;
    t.el.removeAttribute('contenteditable');
    t.el.ownerDocument.getSelection()?.removeAllRanges();
    t.iframe.style.pointerEvents = 'none';
    stage.focus();
    if (keep && t.el.innerHTML !== t.html) save(t.file, t.before);
    marks();
  }

  // ---- The pointer --------------------------------------------------------

  let drag = null;

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }, { passive: false });

  stage.addEventListener('pointerdown', (e) => {
    tell({ active: true }); // Helmy hands the keys over to the canvas
    if (e.target.closest('button')) return;
    stage.focus();
    if (typing) stopTyping(true);
    if (commentBox) closeComment();
    const start = { cx: e.clientX, cy: e.clientY };
    const panning = tool === 'hand' || space || e.button === 1;
    const handle = e.target.closest('.handle');
    const strip = e.target.closest('.strip');
    if (!panning && handle && picked) {
      // Resizing what is picked: an element by its inline size, a screen by its frame.
      const r = picked.el ? picked.el.getBoundingClientRect() : canvas.boards[picked.file];
      drag = { kind: 'size', side: handle.dataset.kind, ...start, file: picked.file, el: picked.el,
        w: picked.el ? r.width : r.w, h: picked.el ? r.height : r.h,
        before: picked.el ? sourceOf(picked.file) : indexText() };
    } else if (!panning && strip) {
      // A screen dragged by its name.
      const file = strip.parentElement.dataset.file, b = canvas.boards[file];
      pick({ file, el: null });
      drag = { kind: 'screen', ...start, file, x: b.x, y: b.y, before: indexText() };
    } else if (!panning && tool === 'comment' && screenAt(e.clientX, e.clientY)) {
      const at = screenAt(e.clientX, e.clientY);
      openComment(at.file, elementAt(at.file, at.x, at.y), at.x, at.y);
      return;
    } else if (!panning && tool === 'select' && screenAt(e.clientX, e.clientY)) {
      const at = screenAt(e.clientX, e.clientY);
      const el = elementAt(at.file, at.x, at.y);
      pick({ file: at.file, el });
      if (el) {
        const cs = el.ownerDocument.defaultView.getComputedStyle(el);
        drag = { kind: 'element', ...start, file: at.file, el, static: cs.position === 'static',
          left: parseFloat(el.style.left) || 0, top: parseFloat(el.style.top) || 0, before: sourceOf(at.file) };
      } else {
        const b = canvas.boards[at.file];
        drag = { kind: 'screen', ...start, file: at.file, x: b.x, y: b.y, before: indexText() };
      }
    } else {
      if (!panning && tool === 'select') pick(null);
      drag = { kind: 'pan', ...start, x: view.x, y: view.y };
      stage.classList.add('panning');
    }
    stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener('pointermove', (e) => {
    if (!drag) {
      if ((tool !== 'select' && tool !== 'comment') || space || typing || commentBox) return;
      const at = screenAt(e.clientX, e.clientY);
      const next = at ? { file: at.file, el: elementAt(at.file, at.x, at.y) } : null;
      if (next?.file !== hover?.file || next?.el !== hover?.el) { hover = next?.el ? next : null; marks(); }
      return;
    }
    const dx = e.clientX - drag.cx, dy = e.clientY - drag.cy;
    // A click's jiggle is not a drag.
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    const wx = dx / view.s, wy = dy / view.s;
    switch (drag.kind) {
      case 'pan':
        view.x = drag.x + dx; view.y = drag.y + dy; apply(); return;
      case 'screen': {
        const b = canvas.boards[drag.file];
        b.x = Math.round(drag.x + wx); b.y = Math.round(drag.y + wy);
        place(drag.file); break;
      }
      case 'element':
        if (drag.static) drag.el.style.position = 'relative';
        drag.el.style.left = Math.round(drag.left + wx) + 'px';
        drag.el.style.top = Math.round(drag.top + wy) + 'px';
        break;
      case 'size': {
        const w = Math.max(drag.el ? 4 : 40, Math.round(drag.w + (drag.side === 's' ? 0 : wx)));
        const h = Math.max(drag.el ? 4 : 40, Math.round(drag.h + (drag.side === 'e' ? 0 : wy)));
        if (drag.el) {
          if (drag.side !== 's') drag.el.style.width = w + 'px';
          if (drag.side !== 'e') drag.el.style.height = h + 'px';
        } else {
          const b = canvas.boards[drag.file];
          b.w = w; b.h = h; place(drag.file); apply();
        }
        break;
      }
    }
    marks();
  });

  const release = () => {
    const d = drag;
    drag = null;
    stage.classList.remove('panning');
    if (!d?.moved) return;
    if (d.kind === 'screen' || (d.kind === 'size' && !d.el)) saveIndex(d.before);
    if (d.kind === 'element' || (d.kind === 'size' && d.el)) save(d.file, d.before);
  };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', () => { if (!drag && hover) { hover = null; marks(); } });

  stage.addEventListener('dblclick', (e) => {
    if (tool !== 'select') return;
    drag = null;
    const at = screenAt(e.clientX, e.clientY);
    if (!at) return;
    const el = elementAt(at.file, at.x, at.y);
    if (el && typeable(el)) startTyping(at.file, el);
    else fit(at.file);
  });

  // ---- Comments -----------------------------------------------------------

  /** Where [el] is in its page, as a selector the agent can find it by. */
  function pathOf(el) {
    const parts = [];
    for (let e = el; e && e.tagName && e.tagName !== 'BODY' && e.tagName !== 'HTML'; e = e.parentElement) {
      let part = e.tagName.toLowerCase();
      if (e.id) { parts.unshift(part + '#' + e.id); break; }
      const same = [...(e.parentElement?.children ?? [])].filter((c) => c.tagName === e.tagName);
      if (same.length > 1) part += `:nth-of-type(${same.indexOf(e) + 1})`;
      parts.unshift(part);
    }
    return ['body', ...parts].join(' > ');
  }

  function openComment(file, target, x, y) {
    closeComment();
    const b = canvas.boards[file];
    const el = document.createElement('div');
    el.className = 'cbox';
    const about = document.createElement('div');
    about.className = 'about';
    const words = target ? (target.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 60) : '';
    about.textContent = (b.title ?? file) + ' · ' + (target ? (words ? `${target.tagName.toLowerCase()} "${words}"` : target.tagName.toLowerCase()) : 'the whole screen');
    const text = document.createElement('textarea');
    text.placeholder = 'What should change here?';
    const row = document.createElement('div');
    row.className = 'row';
    const no = document.createElement('button');
    no.className = 'no'; no.textContent = 'Cancel';
    const go = document.createElement('button');
    go.className = 'go'; go.textContent = 'Add to message';
    row.append(no, go);
    el.append(about, text, row);
    for (const ev of ['pointerdown', 'wheel', 'dblclick']) el.addEventListener(ev, (e) => e.stopPropagation());
    no.addEventListener('click', () => closeComment());
    go.addEventListener('click', () => sendComment());
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComment(); }
      if (e.key === 'Escape') { e.preventDefault(); closeComment(); }
    });
    commentBox = { el, text, file, target, x, y };
    marks();
    tell({ typing: true }); // the keyboard to the box
    setTimeout(() => text.focus(), 0);
  }

  function closeComment() {
    if (!commentBox) return;
    commentBox.el.remove();
    commentBox = null;
    tell({ typing: false });
    stage.focus();
    marks();
  }

  function sendComment() {
    const c = commentBox;
    if (!c) return;
    const note = c.text.value.trim();
    if (!note) { closeComment(); return; }
    const b = canvas.boards[c.file];
    const key = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
    const words = c.target ? (c.target.textContent ?? '').trim().replace(/\s+/g, ' ').slice(0, 80) : '';
    tell({ comment: {
      key, file: c.file, screen: b.title ?? c.file, note,
      element: c.target ? { tag: c.target.tagName.toLowerCase(), words, path: pathOf(c.target) } : null,
    } });
    pins.push({ key, file: c.file, x: c.x, y: c.y, n: ++pinCount });
    closeComment();
  }

  // ---- Keys ---------------------------------------------------------------

  let nudge = null; // a run of arrow presses, saved once it stops

  function setTool(next) {
    tool = next;
    stage.classList.toggle('hand', tool === 'hand' || space);
    stage.classList.toggle('commenting', tool === 'comment');
    if (tool !== 'comment') closeComment();
    hover = null;
    marks();
    tell({ tool });
  }

  function onKey(e) {
    if (commentBox) {
      if (e.key === 'Enter' && !e.shiftKey) sendComment();
      if (e.key === 'Escape') closeComment();
      return;
    }
    if (typing) {
      if (e.key === 'Enter' && !e.shiftKey) stopTyping(true);
      if (e.key === 'Escape') stopTyping(false);
      return;
    }
    const cmd = e.metaKey || e.ctrlKey;
    if (cmd && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (cmd && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomAt(1.25, innerWidth / 2, innerHeight / 2); return; }
    if (cmd && e.key === '-') { e.preventDefault(); zoomAt(0.8, innerWidth / 2, innerHeight / 2); return; }
    if (cmd) return;
    if (e.key === ' ' && !space) { space = true; stage.classList.add('hand'); e.preventDefault(); return; }
    if (e.key === 'v' || e.key === 'V') return setTool('select');
    if (e.key === 'h' || e.key === 'H') return setTool('hand');
    if (e.key === 'c' || e.key === 'C') return setTool('comment');
    if (e.shiftKey && e.key === '!') return fit();
    if (e.key === 'Escape') { if (picked) pick(null); else fit(); return; }
    if (e.key === 'Enter' && picked?.el && typeable(picked.el)) { e.preventDefault(); startTyping(picked.file, picked.el); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && picked?.el) {
      e.preventDefault();
      const { file, el } = picked, before = sourceOf(file);
      el.remove();
      pick(null);
      save(file, before);
      return;
    }
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (arrows[e.key] && picked) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1, [ax, ay] = arrows[e.key];
      if (!nudge || nudge.file !== picked.file || nudge.el !== picked.el) {
        nudge = { file: picked.file, el: picked.el, before: picked.el ? sourceOf(picked.file) : indexText() };
      }
      if (picked.el) {
        const el = picked.el;
        if (el.ownerDocument.defaultView.getComputedStyle(el).position === 'static') el.style.position = 'relative';
        el.style.left = ((parseFloat(el.style.left) || 0) + ax * step) + 'px';
        el.style.top = ((parseFloat(el.style.top) || 0) + ay * step) + 'px';
      } else {
        const b = canvas.boards[picked.file];
        b.x += ax * step; b.y += ay * step; place(picked.file);
      }
      marks();
      clearTimeout(nudge.timer);
      const n = nudge;
      n.timer = setTimeout(() => {
        if (n.el) save(n.file, n.before); else saveIndex(n.before);
        if (nudge === n) nudge = null;
      }, 400);
    }
  }
  function onKeyUp(e) {
    if (e.key === ' ') { space = false; stage.classList.toggle('hand', tool === 'hand'); }
  }
  addEventListener('keydown', onKey);
  addEventListener('keyup', onKeyUp);

  // What Helmy's toolbar and the folder watch call.
  window.HelmyCanvas = {
    reload: (changed) => load(changed ?? true),
    fit: () => fit(),
    focus: (file) => fit(file),
    zoomIn: () => zoomAt(1.25, innerWidth / 2, innerHeight / 2),
    zoomOut: () => zoomAt(0.8, innerWidth / 2, innerHeight / 2),
    zoomTo: (s) => zoomAt(s / view.s, innerWidth / 2, innerHeight / 2),
    tool: (t) => setTool(t),
    undo: () => undo(),
    frames: (on) => { world.classList.toggle('framed', !!on); },
    // The comments still waiting to go, by key: the rest's pins go.
    pins: (keys) => { pins = pins.filter((p) => keys.includes(p.key)); if (!pins.length) pinCount = 0; marks(); },
    // A key Helmy caught for the canvas (macOS gives some to the app first).
    key: (key, shift, meta, up) => {
      const e = { key, shiftKey: shift, metaKey: meta, ctrlKey: false, preventDefault() {} };
      if (up) onKeyUp(e); else onKey(e);
    },
  };
  load();
})();
</script>
</body>
</html>
