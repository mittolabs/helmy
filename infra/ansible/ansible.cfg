# Our servers drop repeated connections (fail2ban, `ufw limit`), and bursts
# of SSH have locked the workspace out before. Everything here is set so one
# playbook run is one SSH connection:
#
# - ControlMaster/ControlPersist: the first task opens a connection and every
#   later task reuses it, instead of connecting once per task.
# - pipelining: modules are fed over that connection rather than copied in a
#   separate transfer.
# - retries = 0: a refused connection is reported, not hammered. Back off a
#   minute and run again.

[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
forks = 5
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
retries = 0
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
control_path_dir = ~/.ansible/cp
