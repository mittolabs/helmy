name: release

# release-please keeps a release pull request open that collects what lands on
# main; merging it is the decision to release. It then tags the release and
# writes the GitHub Release, and this starts the build on that tag (a tag made
# with this workflow's token starts no workflow by itself).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build Helmy for every platform from the new tag
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "${{ needs.release-please.outputs.tag }}" -f tag="${{ needs.release-please.outputs.tag }}"
