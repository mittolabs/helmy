name: app

# The app's analysis and unit tests, on every change to it. Live tests (which
# drive the real CLIs and cost real usage) and the macOS integration tests run
# on a developer's machine, not here.
on:
  workflow_dispatch:
  # Every pull request, whatever it touches: main requires this check to pass
  # before merging, and a check that never runs would hold a pull request for ever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["apps/app/**", "apps/relay/**", "apps/cli/**", ".github/workflows/app.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --exclude-tags live
      # The page the phone and the Chrome extension load is the app built
      # for the web: what it imports must compile there (no dart:ffi), or
      # every release build stops at it.
      - run: flutter build web -t lib/main_chrome.dart -o build/webcheck --no-web-resources-cdn --no-wasm-dry-run --no-source-maps
      # Helmy Connect's relay: its own package, tested here too (the app's
      # tests also run phones through it).
      - run: dart pub get && dart format --output=none --set-exit-if-changed . && dart analyze && dart test
        working-directory: apps/relay
      # The helmy command: its own package, so it compiles on its own.
      - run: |
          dart pub get && dart format --output=none --set-exit-if-changed . && dart analyze
          mkdir -p build && dart compile exe bin/helmy.dart -o build/helmy
          # With no Helmy open it says so, and exits 69.
          code=0; HELMY_RUN_FILE=/nonexistent ./build/helmy run true || code=$?
          [ "$code" = 69 ]
        working-directory: apps/cli
