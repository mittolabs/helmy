name: build

# Helmy for macOS, Windows and Linux, from a release tag, attached to that
# tag's GitHub Release. Started by release.yml, or by hand for a tag.
#
# Error reports go to Bugslad when the repository has a HELMY_ERRORS secret
# (the project's address); without it, builds send nothing.
#
# Not yet: signing and notarizing the macOS build, and automatic updates.
# They wait on an Apple Developer ID (planned December 2026). Then: import
# the certificate from secrets, `codesign --deep --options runtime`, submit
# with `xcrun notarytool`, and `xcrun stapler staple` before zipping.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.2.0; empty builds the branch chosen above, kept as the run's artifacts rather than attached to a release
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/app
        shell: bash
    env:
      # A release's tag, or "dev" for a trial build of a branch.
      TAG: ${{ inputs.tag || 'dev' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # All of history, to count it for the build number.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Linux build tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - name: Build
        run: >-
          flutter build ${{ matrix.platform }} --release
          --build-number="$(git rev-list --count HEAD)"
          --dart-define=HELMY_VERSION="${TAG#v}"
          --dart-define=HELMY_ERRORS="${{ secrets.HELMY_ERRORS }}"
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Helmy.app "Helmy-$TAG-macos.zip"
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Helmy-$env:TAG-windows.zip"
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf "Helmy-$TAG-linux.tar.gz" -C build/linux/x64/release bundle
      - name: Attach to the release
        if: inputs.tag != ''
        run: gh release upload "$TAG" Helmy-"$TAG"-* --clobber
      - name: Keep a trial build with the run
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: Helmy-${{ matrix.platform }}
          path: apps/app/Helmy-dev-*
          retention-days: 7
