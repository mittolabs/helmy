name: build

# Helmy for every platform, from a release tag, attached to that tag's GitHub
# Release; as Applad did its CLI, one file per system and architecture. Flutter
# does not cross-compile, so each is built on a runner of its own kind. Started
# by release.yml, or by hand for a tag (or for a branch, as a trial).
#
# Each desktop build is opened on its runner before it is attached: still
# running after 25 seconds, with a screenshot kept with the run. A build that
# does not open is not released.
#
# Error reports go to Bugslad when the repository has a HELMY_ERRORS secret
# (the project's address); without it, builds send nothing.
#
# The Android app is signed with Helmy's own key when these secrets are set,
# so each release installs over the last: HELMY_ANDROID_KEYSTORE_BASE64 (the
# .jks, base64), HELMY_ANDROID_KEYSTORE_PASSWORD, HELMY_ANDROID_KEY_ALIAS,
# HELMY_ANDROID_KEY_PASSWORD. Without them, the debug key.
#
# Not yet: signing and notarizing the macOS build, signing the Windows one,
# and automatic updates. macOS waits on an Apple Developer ID (planned
# December 2026). Then: import the certificate from secrets,
# `codesign --deep --options runtime`, submit with `xcrun notarytool`, and
# `xcrun stapler staple` before zipping.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.2.0; empty builds the branch chosen above, kept as the run's artifacts rather than attached to a release
        required: false
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            platform: macos
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: android
            os: ubuntu-24.04
            platform: apk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/app
        shell: bash
    env:
      # A release's tag, or "dev" for a trial build of a branch.
      TAG: ${{ inputs.tag || 'dev' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # All of history, to count it for the build number.
          fetch-depth: 0

      # From Flutter's repository at the pinned version: the one way that works
      # on every runner here, arm64 Linux and Windows included.
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux build tools
        if: matrix.platform == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          xvfb imagemagick
      - uses: actions/setup-java@v4
        if: matrix.platform == 'apk'
        with:
          distribution: temurin
          java-version: "17"
      - name: Android signing key
        if: matrix.platform == 'apk'
        env:
          KEYSTORE: ${{ secrets.HELMY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/helmy.jks"
            echo "HELMY_ANDROID_KEYSTORE=$RUNNER_TEMP/helmy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No HELMY_ANDROID_KEYSTORE_BASE64: the APK is signed with a debug key and will not install over an earlier release."
          fi
      - run: flutter config --no-analytics && flutter precache --${{ matrix.platform == 'apk' && 'android' || matrix.platform }}
      - run: flutter pub get

      - name: Build
        env:
          HELMY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HELMY_ANDROID_KEYSTORE_PASSWORD }}
          HELMY_ANDROID_KEY_ALIAS: ${{ secrets.HELMY_ANDROID_KEY_ALIAS }}
          HELMY_ANDROID_KEY_PASSWORD: ${{ secrets.HELMY_ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build ${{ matrix.platform }} --release
          --build-number="$(git rev-list --count HEAD)"
          --dart-define=HELMY_VERSION="${TAG#v}"
          --dart-define=HELMY_ERRORS="${{ secrets.HELMY_ERRORS }}"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          app=build/macos/Build/Products/Release/Helmy.app
          # One app for Apple silicon and Intel: refuse anything less.
          archs=$(lipo -archs "$app/Contents/MacOS/Helmy")
          echo "architectures: $archs"
          [[ $archs == *arm64* && $archs == *x86_64* ]]
          ditto -c -k --keepParent "$app" "Helmy-$TAG-${{ matrix.name }}.zip"
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/${{ matrix.arch }}/runner/Release/* -DestinationPath "Helmy-$env:TAG-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf "Helmy-$TAG-${{ matrix.name }}.tar.gz" -C build/linux/${{ matrix.arch }}/release bundle
      - name: Package (Android)
        if: matrix.platform == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk "Helmy-$TAG-android.apk"

      # It opens: still running after 25 seconds, and what it showed.
      - name: Opens (macOS)
        if: matrix.platform == 'macos'
        run: |
          open -n build/macos/Build/Products/Release/Helmy.app
          sleep 25
          screencapture -x "opens-${{ matrix.name }}.png" || true
          pgrep -f "Helmy.app/Contents/MacOS/Helmy" > /dev/null || { echo "::error::Helmy did not stay open"; exit 1; }
          pkill -f "Helmy.app/Contents/MacOS/Helmy" || true
      - name: Opens (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -PassThru "build/windows/${{ matrix.arch }}/runner/Release/helmy.exe"
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("opens-${{ matrix.name }}.png")
          if ($p.HasExited) { Write-Output "::error::Helmy did not stay open (exit $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
      - name: Opens (Linux)
        if: matrix.platform == 'linux'
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            build/linux/${{ matrix.arch }}/release/bundle/helmy > opens.log 2>&1 & p=$!
            sleep 25
            import -window root "opens-${{ matrix.name }}.png" || true
            if kill -0 $p 2>/dev/null; then kill $p; else tail -30 opens.log; echo "::error::Helmy did not stay open"; exit 1; fi'
      - name: Keep what it showed
        if: always() && matrix.platform != 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: opens-${{ matrix.name }}
          path: apps/app/opens-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach to the release
        if: inputs.tag != ''
        run: gh release upload "$TAG" Helmy-"$TAG"-* --clobber
      - name: Keep a trial build with the run
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: Helmy-${{ matrix.name }}
          path: apps/app/Helmy-dev-*
          retention-days: 7
