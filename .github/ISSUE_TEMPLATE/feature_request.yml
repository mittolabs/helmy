name: Suggest an idea
description: Something you'd like Helmy to do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [open issues](https://github.com/mittolabs/helmy/issues) first, in case someone has asked already.

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and what gets in the way today. This matters more than the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do instead today
